name: ci

# Off: GitHub Actions is unavailable on this account. The suite runs locally instead, on every
# commit (the pre-commit hook) and with `make ci`, which marks the pushed commit as checked on
# GitHub. Runs only when started by hand.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Ratchet (test count may not drop)
        run: uv run python scripts/ratchet.py
