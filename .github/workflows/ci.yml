name: ci

# GitHub Actions minutes are limited on this account, so CI skips commits that only touch docs,
# eval write-ups or the Retell agent's snapshots, and a newer push cancels the run it replaces.
# The pre-commit hook still runs the full suite locally on every commit.
on:
  pull_request:
    paths-ignore: ["docs/**", "evals/rounds/**", "retell/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "evals/rounds/**", "retell/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Ratchet (test count may not drop)
        run: uv run python scripts/ratchet.py
