# What every residential HVAC company shares: the words callers use for the trade's two dangers,
# and how the trade ranks a no-heat or no-cooling call. A tenant's agent.yaml starts with
# `extends: hvac` and adds its own values on top; docs/template.md says how the two files merge.
#
# What the agent says stays with each company (the safety lines, the check questions): each one signs
# off its own script (docs/decisions/24-safety-lines-signoff.md). Numbers sourced to one city, such
# as temperature cutoffs and the age a person counts as older, stay with the tenant too.

# The trade's equipment, as callers name it. Swearing next to one of these ("the damn furnace") is
# about a broken system, not anger at the call, so it doesn't turn a request for a person into a
# demand (app/transfer.py).
# The heating and cooling systems a caller names, longest first, so the call's "already known" note
# lists the one they said and the agent doesn't ask again (eval round 4).
system_words: [heat pump, mini split, central air, boiler, furnace, radiators, radiator]
equipment_words: [furnace, furnaces, boiler, boilers, heat, heater, heating, ac, air, radiator,
  radiators, thermostat, pipe, pipes, vent, vents, filter, fan, compressor]
# Parts of a home, never a person's name in the name check (app/tools.py _gave_a_name).
home_words: [unit, system, pump, apartment, house, building, basement, kitchen, attic]

# Safety signals. The server matches these on every caller line; the tenant's lines say what to do.
safety:
  kinds:
    # Any other danger to people, as the side model reads it (no phrases of its own; DECISIONS.md
    # 131). Its lines are general, and the offer after them is the same.
    hazard:
      label: a hazard
      clear: []
    gas:
      label: gas smell
      clear:
        - smell gas
        - smelling gas
        - smells like gas
        - smell like gas
        - a bit like gas
        - kind of like gas
        - kinda like gas
        - sort of like gas
        - little like gas
        - smelled gas
        - gas smell
        - smell of gas
        - gas leak
        - leaking gas
        - gas is leaking
        - hissing gas
        - hiss of gas
    co:
      label: carbon monoxide
      clear:
        - carbon monoxide
        - monoxide
        - co alarm
        - co detector
  # A caller taking the report back clears the safety state, whatever point it had reached, so the
  # call goes on to booking with a note on the job (Jackson, gas test call
  # call_0246b91f77e01a4b18583e6ca8b: "the caller should be able to be like 'wait nvm, im
  # tripping'... it should be able to get out of its own safety loop"). Not when the same line
  # still reports a smell or alarm, or says the caller has only gone outside.
  retractions:
    - never mind
    - nevermind
    - nvm
    - false alarm
    - its fine
    - it is fine
    - its okay
    - its ok
    - all good
    - its been checked
    - been checked
    - checked it
    - checked with the gas company
    - gas company said
    - said its fine
    - said its safe
    - its fixed
    - been fixed
    - fixed it
    - im tripping
    - i was tripping
    - its not gas
    - it isnt gas
    - its not a gas
    - not a gas leak
    - dont think its leaking
    - dont think it is leaking
    - its not leaking
    - not leaking
    - isnt leaking
    - i was wrong
    - i was mistaken
    - i misspoke
    - scratch that
    - forget that
    # An everyday cause for the smell (socket done-bar call x176-02: "oh, actually no, my
    # roommate was cooking, it's gone now").
    - was cooking
    - were cooking
    - just cooking
  # A caller line that says they're already safe or it's been dealt with: advice the caller cut off
  # under half said isn't said again over it (app/lifecycle.py _cut_off_advice; Retell call
  # call_72009cbe16703210509127925b0).
  safe_now: [fire department, firefighters, fire fighters, gas company, con ed, coned, called 911,
             called 9 1 1, already called, said its fine, said its safe, were safe, im safe,
             everyones safe, its fine, were fine, turned it off, shut it off, breaker is off,
             flipped the breaker]
  # A vague description gets one check question first (the tenant's `question`). A yes counts as a
  # clear signal of that kind; a clear no returns the call to its journey and is logged.
  vague:
    gas:
      phrases:
        - smells off
        - smell something off
        - weird smell
        - strange smell
        - funny smell
        - rotten egg
        - rotten eggs
        - like eggs
        - sulfur
      # Usually harmless, but worth one lighter question: the tenant's `confirm_question`, asked
      # once per call. The first heating of the season smells of burning dust (eval round 2,
      # burning-dust-first-heat).
      confirm_phrases:
        - burning dust
        - burnt dust
        - dusty smell
        - burning smell
        - burnt smell
        - smells like burning
        - smelled like burning
        - smell of burning
        - smells burnt
      # Words a caller uses around a plain "no" to that question that add nothing to it ("no, just
      # dusty, like when the heater first fires up").
      confirm_filler: [dust, dusty, burnt, heat, heater, furnace, boiler, fire, fires, fired, egg,
                       sulphur, alarm, vents, radiator, radiators]
    co:
      phrases:
        - dizzy
        - light headed
        - lightheaded
        - headaches
        - head hurts
        - feel sick
        - nauseous
        - alarm is beeping
        - alarm keeps beeping
  # Heating the home with something that burns fuel indoors gets the tenant's carbon monoxide check
  # question, once per call. Only wording that says it is being used for heat counts, so "my oven
  # works", "a gas stove" or "the generator is outside" ask nothing. Matched three ways: a source
  # followed within three words by a use phrase ("the oven on to keep warm", "the oven on with the
  # door open"), heating "with" a source ("heating with the stove"), or a fixed phrase.
  heating_check:
    kind: co
    sources: [oven, stove, burners, burner, grill, generator, kerosene heater, propane heater,
              charcoal]
    used_for_heat: [for heat, to heat, for warmth, to keep warm, to stay warm, to warm,
                    to keep us warm, to keep the house warm, to keep the place warm,
                    to keep the apartment warm, door open, door opened, door cracked, door ajar]
    phrases: [oven open, oven door open, opened the oven, generator inside, generator in the house,
              generator in the basement, generator in the garage, generator in the apartment,
              grill inside, grill in the house, grill in the apartment, using a kerosene heater,
              running a kerosene heater, using a propane heater, running a propane heater]
  # Electrical trouble at the unit or the panel (DECISIONS.md 082). Its own calm route, separate
  # from gas and carbon monoxide: it never sets their safety state or says their lines, and the
  # agent helps book after it. The tenant's `electrical.lines` say what to do. `now` phrases count
  # unless negated ("no sparks"); `past` forms count unless the same sentence puts them in the past
  # ("it sparked once last year and it's been fine"). Burning dust on the first heat stays with
  # the gas confirm question above.
  electrical:
    now: [sparks, sparking, arcing, arcs, burning plastic, melting plastic, electrical smell,
          burning wire, burnt wire, burning wires, burnt wires, burnt smell from the ac,
          burnt smell from the unit, burning smell from the ac, burning smell from the unit,
          burning smell from the furnace, burning smell coming from the unit,
          burning smell coming from the ac, burning smell coming from the furnace,
          smoke from the furnace, smoke from the ac, smoke coming from the furnace,
          smoke coming out of the furnace, smoke from the outdoor unit,
          electrical burning smell, smells electrical, smell electrical, smells like an electrical fire,
          smoke coming out of the unit, smoke coming from the unit, unit is smoking, furnace is smoking,
          its smoking, smoke from the unit, smoke from the panel,
          smoke from the breaker, panel is smoking, breaker box is smoking]
    # And a single spark ("I saw a spark", "there was a spark from the outdoor unit"), which is
    # usually told as something that happened.
    past: [sparked, arced, smoked, spark]
    # Words in the sentence that put a past mention in the past.
    history: [last year, last month, last week, last winter, last summer, years ago, months ago,
              a while ago, a while back, long time ago, used to, back then, been fine, been ok,
              been okay, since then, got fixed, was fixed, fixed it]
  # A plain denial in the answer to a check question is a no, even with a yes word in it
  # ("definitely not gas"). An unsure word in the same answer still counts as a yes.
  denials: [not gas, no gas, isnt gas, definitely not, not a gas, no smell of gas]

# Priority (spec S-21). `base` is the level for a job type the tenant gives no temperature brackets.
# Each rule fires only on words the caller said on this call or a linked one, never on what the agent
# wrote (DECISIONS.md 072), and can only raise priority. On a mild day (the call starts at Normal) an
# Urgent rule raises to High instead. A "group" rule counts toward the tenant's `combine` rule, if it
# has one.
priority:
  # Planned work is Low, a fault with no strong signal Normal (Jackson, 2026-11-06, DECISIONS.md 130);
  # the rules below and the tenant's seasons raise it.
  base: {no_heat: Normal, no_cooling: Normal, tune_up: Low, safety_check: High, estimate: Low}
  # The caller asked for someone right away, in answer to an offer of that (the dispatch question
  # on a High call, or the safety lines' offer). `offers` are words of the agent's offer line; a
  # caller line after it with an `asks` phrase and no `waits` phrase raises the call to Urgent.
  right_away:
    offers: [out right away, need someone out right away]
    asks: [right away, right now, now please, asap, as soon as possible, immediately, cant wait,
          cannot wait, can not wait, send someone, send somebody, send a technician, send a tech,
          send them, come now, come out now, need someone now, someone now, today please,
          its an emergency, this is an emergency, the last one, the third one]
    waits: [can wait, it can wait, no rush, not urgent, schedule, scheduled, appointment, whenever,
           book it, book a visit, book an appointment, the second one]
  # The inside temperature the agent passes counts only when a caller line carries that number
  # within `reach_words` of one of the `cues`, or answers an agent line with one of the `asked` words.
  inside_temp:
    cues: [degrees, degree, in here, inside, indoors, in the house, in the apartment, thermostat,
           temperature, temp, cold, freezing, hot, warm, boiling, house, home, down to, dropped,
           falling, says, reads]
    asked: [temperature, thermostat, degrees, how cold, how warm, how hot, cold, chilly, warm, hot]
    reach_words: 4
    # An agent's temperature question stays open for this many caller lines, or until one gives a
    # number ("let me check", "Sure", "it says 48").
    asked_lines: 3
    plausible_f: [20, 110]  # a number outside these isn't an inside temperature
  # A caller asking for a higher priority with no new fact. The server's turn check gives the agent
  # a note on how to answer (prompts/assemble.py, priority_pushed); nothing here raises anything.
  pushes: [its an emergency, its an emergency call, this is an emergency, its urgent, this is urgent,
           make it urgent, mark it urgent, mark it as urgent, put it as urgent, put it down as urgent,
           make it an emergency, make it a priority, make me a priority, make this a priority,
           higher priority, top priority, high priority, put me first, put us first, put me at the top,
           move me up, move us up, bump me up, bump us up, top of the list, front of the line,
           skip the line, ahead of everyone, ill pay extra, i can pay extra, i will pay extra,
           happy to pay extra, ill pay more, i can pay more, ill pay double, ill pay whatever,
           pay whatever it takes]
  # Words in an agent line that ask who is at home and whether anyone is at risk, so the note asks
  # that question only if it hasn't been asked on the call.
  at_risk_asked: [anyone at home, anyone there, anyone in the home, who is home, whos home,
                  who lives, older, elderly, baby, babies, medical equipment, oxygen]
  rules:
    - id: vulnerable_person
      job_types: [no_heat, no_cooling]
      # "Babys" is "the baby's room" once the apostrophe is dropped.
      # "Newborns" is "my newborn's here" once the apostrophe is dropped (Retell call
      # call_feed25cb0e5df1017695f9dc210 stayed Normal).
      phrases: [elderly, senior, seniors, grandmother, grandfather, grandma, grandpa, baby, babys,
                babies, infant, infants, newborn, newborns, months old, weeks old]
      raise_to: Urgent
      raise_to_when_mild: High
      reason: an older person or a baby at home
    - id: medical_equipment
      job_types: [no_heat, no_cooling]
      phrases: [oxygen, concentrator, cpap, bipap, dialysis, nebulizer, ventilator, hospital bed,
                medical equipment]
      raise_to: Urgent
      raise_to_when_mild: High
      reason: medical equipment at home
    - id: bedbound
      job_types: [no_heat, no_cooling]
      phrases: [bedridden, bedbound, bed bound, cant get up, cant walk, hospice, home health aide]
      raise_to: Urgent
      raise_to_when_mild: High
      reason: someone at home who can't get up
    - id: symptoms_now
      job_types: [no_heat, no_cooling]
      phrases: [shivering, cant stop shaking, dizzy, short of breath, feels faint, feeling faint,
                heat exhaustion]
      raise_to: Urgent
      raise_to_when_mild: High
      reason: someone feeling unwell from the temperature now
    - id: improvised_heating
      job_types: [no_heat]
      phrases: [using the oven, oven on, oven open, stove on, kerosene heater, generator inside,
                grill inside]
      heating_indoors: true  # also the safety check's heating wording (safety.heating_check)
      raise_to: Urgent
      reason: heating with an oven, stove, generator or grill indoors
    - id: young_child
      job_types: [no_heat, no_cooling]
      phrases: [toddler, little kids, little ones, preschooler, small children, young kids]
      raise_to: High
      group: true
      reason: young children at home
    - id: parent_no_age
      job_types: [no_heat, no_cooling]
      # A spouse's parent counts too ("his mother's here too" reads "his mothers here", eval run
      # 20261104-172529).
      phrases: [my mom, my dad, my mother, my father, my parents, mother in law, father in law,
                his mother, her mother, his father, her father, his mom, her mom, his dad, her dad,
                his parents, her parents, his mothers, her mothers, his fathers, her fathers]
      raise_to: High
      group: true
      reason: a parent at home, age not given
    - id: limited_mobility
      job_types: [no_heat, no_cooling]
      phrases: [wheelchair, walker, cane, crutches, mobility scooter, disabled, disability, paralyzed,
                special needs, cant get around]
      raise_to: High
      group: true
      reason: someone with limited mobility or a disability
    - id: lives_alone
      job_types: [no_heat, no_cooling]
      # "Just me at home" and the like (a rig call: an 84-year-old alone with a cane booked High).
      phrases: [lives alone, live alone, by herself, by himself, by myself, no one else,
                just me at home, just me here, its just me, im alone, i am alone, home alone,
                alone at home, on my own, only one here, only one home, caller alone, all alone,
                all by myself]
      # "Just me and my partner" names someone else at home. Only the "just me" phrases: "I live
      # alone and my heat is out" still raises.
      unless_followed_by:
        phrases: [its just me, just me at home, just me here]
        words: [and, with, plus]
      raise_to: High
      group: true
      reason: someone at home alone
    - id: chronic_illness
      job_types: [no_heat, no_cooling]
      phrases: [heart condition, heart problems, copd, asthma, lung disease, emphysema, diabetic,
                diabetes, kidney disease, medical condition, stroke, had a stroke,
                recovering from a stroke]
      # Said in a way that isn't an illness: these are taken out before the phrases are matched.
      not_phrases: [stroke of luck, stroke of genius, brush stroke, swim stroke, at the stroke of]
      raise_to: High
      group: true
      reason: a chronic illness at home
    - id: cognitive
      job_types: [no_heat, no_cooling]
      phrases: [dementia, alzheimers, memory problems, gets confused]
      raise_to: High
      group: true
      reason: someone with dementia or memory problems
    - id: pregnancy
      job_types: [no_heat, no_cooling]
      phrases: [pregnant, expecting a baby, third trimester]
      raise_to: High
      group: true
      reason: someone pregnant at home
    - id: recovering
      job_types: [no_heat, no_cooling]
      phrases: [just had surgery, recovering from surgery, post op, chemo, chemotherapy, transplant,
                immunocompromised, weak immune system]
      raise_to: High
      group: true
      reason: someone recovering or with a weak immune system
    - id: pipes_or_only_heat
      job_types: [no_heat]
      phrases: [pipes froze, frozen pipes, pipes are freezing, no other heat, only heat, only source of heat]
      raise_to: High
      reason: pipes at risk or no other heat
    # Water from the system coming into the home is Urgent on any day (DECISIONS.md 082).
    - id: water_in_home
      phrases: [water through the ceiling, water coming through the ceiling, water coming from the ceiling,
                water from the ceiling, water dripping from the ceiling, dripping from the ceiling,
                dripping through the ceiling, leaking through the ceiling, leaking from the ceiling,
                coming through the ceiling, ceiling is leaking, ceilings leaking, ceiling is dripping,
                ceilings dripping, leaking into the house, leaking into the apartment, leaking into the home,
                leaking into the bedroom, leaking into the living room, water all over the floor,
                flooding the floor, water is pouring, pouring water]
      # Or callers' own words: a water word within a few words of the cooling equipment or of the
      # ceiling or a wall ("water coming through my living room ceiling", "the AC is dripping
      # water", "running down the wall"). A faucet, sink, toilet or water heater near the water word
      # means it's plumbing, not the system ("the kitchen faucet is dripping and the AC is broken").
      together:
        first: [water, leak, leaking, leaks, leaked, dripping, drips, pouring, flooding, flooded,
                soaked, soaking, puddle, puddles, running down, dripping down, water stain, wet,
                overflowed, overflowing, overflows]
        second: [ceiling, ceilings, wall, walls, ac, a c, air conditioner, air conditioning,
                 air handler, mini split, ductless, the unit, unit, indoor unit, attic unit,
                 condensate, drain pan, vent, vents, register, registers]
        within: 8
        unless_near: [faucet, sink, toilet, tub, shower, dishwasher, washing machine, water heater,
                      hot water heater, pipe, pipes, radiator, boiler]
      not_phrases: [water heater, hot water, water bill, water pressure]
      raise_to: Urgent
      reason: water coming into the home
    # A breaker that trips again and again isn't an emergency, but it goes ahead of routine work.
    - id: breaker_trips
      # Present tense says it happens again and again: "my breaker trips when the AC kicks on".
      # "It tripped once in the storm" doesn't count.
      phrases: [breaker trips, breakers trip, breaker is tripping, breakers are tripping,
                breaker tripping, trips the breaker, tripping the breaker, trips my breaker,
                tripping my breaker, trips the circuit, breaker keeps tripping, breakers keep tripping,
                tripped when the, tripped every time, trips when the, trips whenever,
                keep resetting the breaker, keep resetting it, keeps resetting the breaker,
                resetting the breaker, reset the breaker again, reset the breaker twice,
                keeps tripping the breaker,
                keeps tripping breakers, keeps tripping my breaker, keeps flipping the breaker,
                breaker keeps flipping, breaker trips every time, trips the breaker every time,
                tripped the breaker again, breaker tripped again, keeps blowing the breaker,
                keeps blowing a fuse, keeps blowing fuses, keeps tripping the circuit]
      raise_to: High
      reason: a breaker that keeps tripping
    # Sparks, arcing or an electrical smell, as the electrical route heard it (safety.electrical).
    - id: electrical_fault
      electrical_signal: true
      raise_to: High
      reason: sparks or an electrical smell at the unit
    - id: safety_signal
      safety_signal: true
      # High, so a visit booked for later is scheduled ahead of routine work; sending someone now
      # is the caller's choice, and that raises it to Urgent (right_away).
      raise_to: High
      reason: gas or carbon monoxide reported on the call
    # A fault the caller describes in strong words: it's out, not just weak, or it's making a
    # telling noise or leaking (Jackson: "it's banging", "it's completely out").
    - id: fault_callout
      job_types: [no_heat, no_cooling]
      phrases: [completely out, totally out, all the way out, not working at all, stopped working,
                quit working, died, is dead, wont turn on, wont come on, doesnt turn on, not turning on,
                wont start, no air coming out, nothing coming out, banging, clanking, grinding,
                screeching, squealing, rattling loudly, iced up, frozen up, ice on the,
                blowing hot air, blowing warm air, blowing cold air]
      not_phrases: [not completely out, not totally out, water heater, hot water heater, faucet, sink,
                    toilet, tub, shower, dishwasher, washing machine]
      raise_to: High
      reason: a fault the caller described
    - id: caller_needs_now
      right_away: true
      raise_to: Urgent
      raise_to_when_mild: Urgent
      reason: the caller needs someone right away

# Journey 11: which job types the after-hours rules apply to, and which priority rules mean someone
# at home is at extra risk. The tenant sets the temperature cutoffs.
after_hours:
  heating_job_types: [no_heat]
  cooling_job_types: [no_cooling]
  at_risk_rules: [vulnerable_person, medical_equipment]

# Work callers ask an HVAC company for that another trade usually does, in the words callers use
# (issue #129). Each tenant says which of these it doesn't do and who to suggest instead
# (services.not_offered); a kind it leaves out is never declined. Words that also name heating or
# cooling ("pipes", "oven", "water") are left out, so a no-heat call is never turned away. A phrase
# with one of near_equipment within near_words words of it is the trade's own work: "my AC drain is
# clogged" is a condensate drain, not plumbing (PR #135 review).
services:
  near_words: 3
  near_equipment: [ac, air conditioner, air conditioning, condensate, mini split, heat pump, furnace,
                   boiler, hvac, central air]
  kinds:
    plumbing: [sink, sinks, toilet, faucet, clogged drain, drain is clogged, drains are clogged,
               garbage disposal, burst pipe, pipe burst, plumbing, plumber]
    appliances: [fridge, refrigerator, freezer, dishwasher, washing machine, my washer,
                 my dryer, the dryer, clothes dryer, microwave]
    water_heater: [water heater, hot water heater, hot water tank]
    duct_cleaning: [duct cleaning, clean my ducts, clean the ducts, clean our ducts, ducts cleaned,
                    clean out the ducts, dryer vent cleaning]

# Paying and billing on the phone (DECISIONS.md 080). A caller who offers a card hears the tenant's
# `card_stop` line, said by the voice layer word for word; card digits are never stored
# (app/cards.py). A caller who disputes a charge gets a callback from the office.
payments:
  card_phrases: [pay by card, pay with a card, pay with my card, pay with card, pay by credit card,
                 pay with a credit card, pay with my credit card, pay by debit card, pay with my debit card,
                 pay with a debit card, give you my card, give you my credit card, give you the card,
                 read you my card, read you the card, take my card, take a card, take a credit card,
                 put it on my card, put it on a card, charge my card, charge it to my card,
                 my card number, the card number, credit card number, card over the phone,
                 pay over the phone, pay for it now, pay now over the phone, my card is, heres my card,
                 pay my bill, pay the bill, pay my balance, pay the balance, pay what i owe, make a payment]
  billing_phrases: [charged twice, double charged, charged me twice, overcharged, over charged,
                    charged too much, wrong charge, charge is wrong, bill is wrong, billed twice,
                    billed me twice, billing mistake, billing error, dispute a charge, dispute the charge,
                    dispute the bill, didnt authorize, did not authorize, never authorized,
                    want a refund, need a refund, get a refund, refund my]

# lookup_hvac_info (app/hvac_info.py): words callers use for the same thing, read as one before a
# question is matched against the tenant's lookup documents.
lookup_synonyms:
  air conditioning: ac
  air conditioner: ac
  a c: ac
  central air: ac
  heater: furnace
  knocking: banging
  knock: banging
  clanking: banging
  clanging: banging
  bang: banging
  rads: radiator
  turns on and off: short cycling
  on and off: short cycling
  keeps cycling: short cycling
  co: carbon monoxide
