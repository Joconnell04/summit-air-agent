# How the phone agent works for Summit Air. The tool server reads this file and config.yaml (the
# company as its field service system knows it: hours, area, job types, plans). Nothing here is
# hard-coded in app/. Values marked ASSUMED are guesses until Summit Air confirms them.

# What every HVAC company shares (safety signal phrases, priority rules) is in trades/hvac/agent.yaml.
# Values here are added on top of it; docs/template.md says how the two files merge.
extends: hvac

# The numbers callers dial. The dialed number picks the tenant.
phone_numbers:
  - "(646) 624-0418"  # our LiveKit stack (DECISIONS.md 004)
  - "(678) 336-6730"  # the Retell baseline, during the bake-off

fsm:
  adapter: servicetitan
  # The mock (make mock-st). FSM_BASE_URL overrides it. The mock's credentials are in config.yaml
  # (auth); real ones come from FSM_CLIENT_ID, FSM_CLIENT_SECRET and FSM_APP_KEY.
  base_url: http://127.0.0.1:8101
  booking_provider_id: 501
  campaign_id: 301  # "AI phone agent"
  cancel_reason_id: 401  # "Customer cancelled"
  # The ServiceTitan user the integration acts as: notes it adds carry this createdById.
  agent_user_id: 9001
  # The call reason a lead carries for each of record_lead's kinds (config.yaml call_reasons).
  lead_call_reason_ids: {commercial: 704, install: 702, membership: 705, not_offered: 706}
  # Tag types (config.yaml tag_types) that say how a callback call went. A person at the office
  # puts one on the call in ServiceTitan; the server puts one on the callbacks it places itself.
  # Only "resolved" marks a callback done (docs/decisions/26-callback-done.md).
  callback_tags:
    resolved: Callback resolved
    open: Callback open
    no_contact: No contact
  # The mock's stand-in for the phone system logging a call (POST /debug/calls). Real ServiceTitan
  # logs calls itself, so a real tenant leaves this out or false.
  log_calls_via_debug: true

# Safety script. Wording follows docs/call-journeys.md journey 3 and must be signed off by a person
# before launch (signed_off). The server returns these lines word for word; the agent never writes
# its own. The phrases that trigger it are the trade's.
safety:
  signed_off: true
  # Advice, never an order: no "please get out now" and no "are you outside?" (Jackson, gas test
  # call call_0246b91f77e01a4b18583e6ca8b: "it shouldn't be demanding me to do anything"). "9-1-1"
  # so the voice says nine one one, not nine hundred and eleven.
  kinds:
    gas:
      lines: >-
        If you're smelling gas, the safest thing is to get everyone outside and call 9-1-1 or the gas
        company from there.
    co:
      lines: >-
        If a CO alarm is going off, the safest thing is to open a window if one's right there, get
        everyone outside, and call 9-1-1 from there.
  # The one check question a vague description gets first (the trade's vague phrases).
  vague:
    gas:
      question: Just to be safe, are you smelling gas in the house right now?
      # Asked once when the trade's confirm phrases come up ("burning dust"). Asked the negative way,
      # so a "yeah" or "right" clears it (app/safety.py answer_to_confirm). Signed off by Jackson in
      # eval round 2.
      confirm_question: Just to confirm, it doesn't smell like sulfur or rotten eggs, right?
    co:
      question: Just to be safe, is a carbon monoxide alarm going off, or is anyone feeling sick or dizzy?
  # Said once when a safety call ends, then the call hangs up (Jackson, call
  # call_0246b91f77e01a4b18583e6ca8b: the call stayed open after "I'm done").
  sign_off: Thanks for calling, and please stay safe. We'll follow up with you.
  flag_reason: "{label} reported on the call"
  # Added to the booking sentence when a visit is booked on a safety call (eval round 2, Jackson: "we'll
  # book a technician for you, but first it's important that whatever the problem is shut off").
  # Signed off by Jackson (spec r8 in docs/ai-process/coauthoring.md).
  booking_note: Just so you know, the technician can only work on it once it's been checked and found safe.
  # The lines are said once per hazard; the same smell or alarm raised again gets nothing more
  # (Jackson: "it keeps repeating the same statement"). A different hazard still gets its own lines.
  repeat_limit: 0
  # Sparks, arcing or an electrical smell (app/safety.py electrical_signal, DECISIONS.md 082): said
  # once per call, word for word, then the agent helps book. Never the gas or carbon monoxide
  # lines. Booking never waits on the unit or the breaker being off. Signed off by Jackson
  # (coauthoring safety r1).
  electrical:
    signed_off: true
    lines: >-
      Please step away from the unit and turn it off, and if you can safely reach the breaker,
      switch that off too. I can get a technician out to look at it.

# A caller line that describes a business marks the call commercial: it can't book (spec S-05,
# journey 8). Commercial means commercial-grade equipment: offices, stores, restaurants and the like.
# Homes, apartments, co-ops, condos and whole apartment buildings are residential, including a super
# or building manager calling about the building's residential systems (eval round 2), so "my
# tenants", "our building", "the building I manage" and a count of units mark nothing. Three ways to
# match: "my restaurant" or "our bakery" (my or our right before a business), "I run a restaurant"
# (a running word, then a, an or the and at most one more word, then a business), and fixed phrases.
# Ownership counts only when it attaches to the business: "the bakery across from me is mine"
# (mine, right after the business and at most four words), or "I own the place, it's a deli" (an
# own_place phrase with "it's a" and the business). "I own the place, the bar next door is loud"
# names a neighbor, so it marks nothing (PR #135 review). An office counts only with its heating or
# cooling ("the heat in my office", "our office AC"), since "my office called me" is about work.
# A line that names the caller's home as the place ("at home", "my house") is residential, whatever
# job words come before it ("I'm a church deacon calling about my house").
# Exclusions are removed before matching, so "my business partner" stays a home.
commercial:
  owned: [restaurant, bakery, deli, cafe, bar, store, shop, salon, gym, clinic, daycare, warehouse, business]
  run: [restaurant, bakery, deli, cafe, bar, store, shop, salon, gym, clinic, daycare, warehouse,
        business, company, school, church, hotel, office]
  phrases: [office building, office space, commercial property, commercial space, commercial unit,
            commercial building, commercial tenants, retail space, retail, storefront, shopping center,
            strip mall, plaza, hotel, church, dental practice, rooftop unit, "it's a business",
            it is a business, "it's commercial"]
  # "Not my home" is a business, unless the same line says it's an apartment building: "it's not
  # my home, it's twelve units" is a super or manager, which is residential. "It's a building, not a
  # home", said to the read-back's "your home", is a building manager too (eval runs 20261104-040959
  # and 052332); an office building is caught by the phrases above first.
  not_home: [not a home, not my home]
  apartment_signs: [units, apartments, apartment building, unit building, family house, walk up,
                    building, tenants]
  mine: [is mine, is ours, belongs to me, belongs to us]
  own_place: [i own the place, we own the place, i own this place, we own this place, i own it,
              we own it, im the owner, were the owners]
  office: {words: [office], systems: [heat, heating, ac, air conditioning, air conditioner, cooling,
                                      furnace, boiler, thermostat, radiators, hvac]}
  home_signs: [at home, my house, my home, my apartment, our house, our home, our apartment]
  not: [business partner, business trip, business card, home office, my own business hours]

# What Summit Air does and doesn't (issue #129). Bookable work is the job types in config.yaml;
# offered says it in words for the owner view and the docs. A request for work in not_offered (the
# trade's services.kinds say how callers put it) gets the not_offered line, said once per kind, and
# is kept as a lead so the office sees the demand. suggest is a general kind of business, never a
# brand. Duct cleaning isn't a job type here, so it is declined like the others (ASSUMED).
services:
  offered: [heating repair, cooling repair, maintenance tune-ups, gas and carbon monoxide safety
            checks, replacement estimates]
  not_offered:
    plumbing: {what: plumbing, suggest: a plumber}
    appliances: {what: appliance repair, suggest: an appliance repair shop}
    water_heater: {what: water heaters, suggest: a plumber}
    duct_cleaning: {what: duct cleaning, suggest: a duct cleaning company}

# Who can approve the work (eval round 2, co-op-owner-mentions-board). A caller who says a board or
# a landlord has to approve is offered a callback to settle it; if they ask to book anyway, the
# booking gets a call this many hours before the window opens (moved into calling hours) to confirm
# approval before dispatch. unclear_approver is matched in the approver the agent records. ASSUMED.
approval:
  unclear_phrases: [co-op board, coop board, condo board, building board, board approval,
                    board has to approve, board needs to approve, board to approve, board has to be told,
                    board has to know, tell the board, ask the board, check with the board,
                    landlord has to approve, landlord needs to approve, ask my landlord,
                    check with my landlord, check with the landlord, management has to approve,
                    not sure who approves, not sure if i can approve, "not sure i can approve"]
  unclear_approver: [board, not sure, unclear, unknown, to confirm, to be confirmed, tbd, needs approval]
  callback_hours_before_window: 2

# Priority (spec S-21, docs/explorations/007-priority-brackets.md). A no-heat or no-cooling call
# starts at the first bracket that fits the inside temperature the caller gives and the outside
# temperature (app/weather.py); rules then can only raise it. Cutoffs are ASSUMED within the sourced
# bands in exploration 007 (NYC heat law 62 F at night, WHO 64 F, the 55 F pipe-freeze line, NYC's
# 78 F cooling line, Health Canada's 31 C), to be tuned from real calls. An unknown temperature
# fails safe to High.
priority:
  brackets:
    no_heat:
      - {id: cold_inside, inside_below_f: 55, level: Urgent, reason: below 55 F inside}
      - {id: cool_inside, inside_below_f: 65, level: High, reason: below 65 F inside}
      - {id: cold_outside, outside_coldest_below_f: 55, if_unknown: match, level: High,
         reason: cold outside or tonight, so the house keeps cooling}
      - {id: mild, level: Normal, reason: a mild day}
    no_cooling:
      - {id: hot_inside, inside_above_f: 85, level: Urgent, reason: above 85 F inside}
      - {id: warm_inside, inside_at_least_f: 79, level: High, reason: 79 F or more inside}
      - {id: hot_outside, outside_now_at_least_f: 80, if_unknown: match, level: High,
         reason: 80 F or more outside}
      - {id: mild, level: Normal, reason: a mild day}
  # Added to the trade's rule of the same id. NYC Health heat and cold guidance names adults 60 and
  # over; "I'm 84".
  rules:
    - {id: vulnerable_person, age_at_least: 60}
  # Two different "group" rules together make Urgent (NYC Health's cold alert: no heat and a risk
  # factor).
  combine: {groups: 2, raise_to: Urgent, reason: two risk factors at home together}
  # A side model reads the caller's lines for someone at risk the phrase rules above miss ("my pop
  # turned ninety", "she's on dialysis"). It answers one question (prompts/side/questions.yaml) and
  # can only raise priority, like the rules. Used only when the server runs with SIDE_MODEL set
  # (app/side_model.py); a late or failed answer leaves the rules to decide. Threshold 0.65, raised
  # from 0.5 because the question allows implied mentions, so a borderline line can cross 0.5; on the
  # 80 test lines the only answer between 0.5 and 0.65 was a false alarm, and every true one scored
  # 0.78 or more (MEASURED, evals/decision-models, DECISIONS.md 090).
  side_model:
    question: vulnerable_person
    job_types: [no_heat, no_cooling]
    threshold: 0.65
    raise_to: Urgent
    raise_to_when_mild: High
    reason: someone at home at risk from the heat or cold

# Where the outside temperature comes from (app/weather.py, exploration 007): the National Weather
# Service's Central Park station and the forecast grid point over New York City. The service asks
# for a User-Agent naming the app and a contact.
weather:
  station: KNYC
  gridpoint: OKX/33,42
  user_agent: summit-air-agent (github.com/Joconnell04/summit-air-agent)

# Journey 11: how a no-heat or no-cooling call ends after hours. ASSUMED cutoffs; which job types
# and priority rules they apply to are the trade's.
after_hours:
  tonight_below_f: 50
  morning_above_f: 55
  cooling_tonight_above_f: 85
  cooling_morning_below_f: 80
  on_call_confirms_within_minutes: 20

callbacks:
  owner_in_hours: office
  owner_after_hours: on_call
  # Outbound calls only between these local times, one attempt (spec S-42).
  outbound_hours: ["08:00", "21:00"]
  max_attempts: 1
  # A dropped safety call gets a callback this soon.
  dropped_safety_minutes: 10
  # A callback asked for "after 5" is promised for this long after the start ("around 5:30"). ASSUMED.
  after_lead_minutes: 30
  # A billing dispute: the office calls back within this, inside office hours (DECISIONS.md 080).
  # ASSUMED.
  billing_minutes: 120
  # A callback stored with no time because the caller had already said goodbye. ASSUMED.
  after_goodbye_minutes: 60
  # When the FSM is down or refuses a booking, someone calls back within this.
  fsm_down_minutes: 60

# Email to the on-call person when an urgent flag is raised after hours (journey 11). ASSUMED
# address until Summit Air gives one. seek_earlier is left out: that booking already has a time,
# and the office looks for an earlier one in the morning.
on_call_alerts:
  email: on-call@summit-air.example
  priorities: [Urgent]
  skip_kinds: [seek_earlier]
  # A flag older than this when the job first sees it is not emailed: the moment has passed.
  max_age_minutes: 120

repeat_callers:
  # Every call stands alone: no earlier call's lines, bookings, limits, safety or priority carry
  # into the next one from the same number (Jackson, after five scripted calls from one number in a
  # row, call_feed25cb0e5df1017695f9dc210 to call_f0846787038f654309219adb1e8: a tune-up heard the
  # previous call's sparks line). The settings below apply only to a tenant that links calls.
  link_calls: false
  link_within_minutes: 10
  # A dropped call is picked up ("I think we got cut off earlier") only by a call that starts this
  # soon after the drop. Jackson after slate call 2 (call_3cd4c8065f26d3de686f7a1e002): "only if
  # called within a few minutes".
  link_after_drop_minutes: 5
  drops_before_callback_offer: 2
  # A booking at an address with a job finished this recently flags a person to review it (journey
  # 7 step 3). ASSUMED: a month, the usual window a callback on recent work is checked in.
  return_visit_days: 30

# Speaking rate (app/pace.py, DECISIONS.md 053). The server moves the pace from the caller's lines and
# the voice worker applies it to that call only. Steps are the same size each way, so a caller can
# ask to speed up as easily as to slow down. Cartesia sonic-3 takes 0.6 to 2.0 (SOURCE: the LiveKit
# Cartesia plugin's docs for `speed`); the step and bounds are ASSUMED until a listen. 0.85 for an
# older adult is Jackson's number (053), and 65 is his line for pace (priority's is 60, 019).
pace:
  normal: 1.0
  step: 0.15
  slowest: 0.7
  fastest: 1.3
  older_adult_age: 65
  older_adult_speed: 0.85
  # "Sorry, what?" this many times since the pace last moved is one step slower.
  repeats_before_slower: 2
  # A request counts only when it is about how the agent speaks: a phrase with a speech word, "slow
  # down" or "speed up" said to the agent with no object, or a whole line that is only a request.
  # Never on a line with a job word ("send someone faster", "speed up the install"), and never
  # negated ("you don't need to speak slower"). "The fan is slower" or "it heats too slow" never match.
  slower_phrases: [speak slower, talk slower, speak more slowly, talk more slowly, speak slowly,
                   talk slowly, say it slower, say that slower, say it slowly, say that slowly,
                   say that again slower, say that again slowly, say it again slower,
                   say it again slowly, repeat that slower, repeat that slowly, youre talking too fast,
                   youre talking so fast, youre talking fast, you talk too fast, you talk so fast,
                   youre speaking too fast, you speak too fast, talking too fast, talking so fast,
                   speaking too fast, speaking so fast, youre going too fast, youre too fast,
                   dont talk so fast, need you to slow down, want you to slow down]
  faster_phrases: [talk faster, speak faster, talk a little faster, talk a bit faster,
                   speak a little faster, speak a bit faster, talk quicker, speak quicker,
                   talking too slow, talking so slow, talking too slowly, speaking too slow,
                   speaking so slow, you talk too slow, you speak too slow, need you to speed up,
                   want you to speed up]
  normal_phrases: [normal speed, regular speed, normal pace, regular pace, usual speed, usual pace]
  # "Slow down" and "speed up" on their own count only when said to the agent: after one of the
  # `before` words or at the start of the line, and followed by nothing or one of the `after` words.
  slower_imperative: slow down
  faster_imperative: speed up
  imperative_before: [you, can, please, whoa, hey, ok, okay, just, sorry, wait, um, uh, so, oh,
                      now]
  imperative_after: [please, a, for, there, ok, okay, sorry, im, i, youre, so, thanks, thank, now]
  # A whole line that is only a request, once these filler words are dropped.
  line_fillers: [um, uh, oh, ok, okay, sorry, please, so, just, hey, can, could, would, you, maybe]
  slower_lines: [slower, a little slower, a bit slower, little slower, bit slower, more slowly,
                 slowly, slow it down, slower this time]
  faster_lines: [faster, a little faster, a bit faster, little faster, bit faster, quicker,
                 speed it up, go faster, pick up the pace]
  job_words: [send, someone, somebody, technician, tech, guy, crew, install, installation, repair,
              appointment, visit, come, coming, get here, schedule, service, fix, job, process,
              furnace, boiler, heater, heat, ac, fan, blower, motor, unit, system, drain,
              thermostat, pump, radiator, water]
  # The address alone: one of these phrases, or right after the read-back a slow word with a repeat
  # word ("can you say that again slower?"). "My heat is slow, I live on Main Street" is neither.
  address_phrases: [the address slower, the address slowly, the address more slowly,
                    the address again slower, the address again slowly, address back slower,
                    address back slowly, slower on the address, slowly on the address]
  slow_words: [slower, slowly]
  repeat_words: [repeat, again, say that, say it, read that, read it]
  # "Sorry, what?": a whole line that is only one of these, or a line with one of the phrases.
  repeat_lines: [what, huh, sorry, pardon, sorry what, what sorry, excuse me, what was that,
                 come again, say again]
  repeat_phrases: [sorry what, what did you say, say that again, can you repeat that,
                   could you repeat that, repeat that please, i didnt catch that, didnt catch that,
                   i didnt hear that, didnt hear you, i cant hear you, pardon me, come again]
  # The caller about themselves; "my elderly mother" is about someone else.
  older_adult_phrases: [im elderly, i am elderly, im a senior, i am a senior, im a senior citizen,
                        im an old man, im an old woman, im an old lady, im getting old, im not young anymore]

retention:
  transcript_days: 30
  call_record_days: 365
  # Each call's audio, kept on the server and deleted with its transcript. Recording also needs a
  # bucket for LiveKit to upload to (RECORDING_S3_* in the server's .env); without one, none is made.
  record_calls: true

# Warm transfer to a person (C-11). The server decides: a caller who asks for a person during
# office hours goes to the office, and an urgent call after hours goes to the on-call technician.
# Never on a gas or carbon monoxide call. A caller who demands a person (insistently, again, or
# angrily) is sent straight through instead, with no summary: the office in hours, the on-call
# technician after hours, and on a safety call only once the fixed lines have been said
# (app/transfer.py). Each role names the server environment variable that holds its number, so no
# number is in the repo; an unset number keeps the flag and callback.
transfer:
  targets:
    office: TRANSFER_OFFICE_NUMBER
    on_call: TRANSFER_ON_CALL_NUMBER
  # How long the person's phone rings before the agent comes back (ASSUMED).
  ring_seconds: 20
  # After the first line, how long the person has to press 1 (ASSUMED). A voicemail never does.
  accept_seconds: 10
  # The callback promised when no time was asked for and nobody answers (ASSUMED).
  fallback_callback_minutes: 30

# Lines the server returns as `say`. {time} is a named callback time, such as "4:30 PM".
lines:
  fsm_unavailable: >-
    I can't book that right now, but I've written it all down and someone will call you by {time} to
    confirm.
  fsm_unavailable_no_callback: I can't get to that right now, but I've written it all down for the team.
  # {when} is how the callback time is said, from the callback_ lines below.
  flag_stored: I've let our team know, and someone will call you {when}.
  flag_stored_urgent: I've let our team know this call is top priority, and someone will call you {when}.
  # The same after hours, when the on-call technician has the urgent calls (journey 11).
  flag_stored_on_call: >-
    I've let our on-call team know this call is top priority, and someone will call you {when}.
  flag_stored_no_callback: I've let our team know.
  # Warm transfer. The handoff is said to the caller; the summary only to the person answering.
  transfer_handoff: I'm connecting you with someone from our team now.
  transfer_no_answer: I couldn't reach anyone just now, so I've let the team know and someone will call you {when}.
  # The first line names no caller, in case a voicemail greeting answered.
  transfer_prompt: Summit Air has a caller for the {role}. Press 1 to take the call.
  transfer_summary: "{priority}Caller at {phone}: {reason}. Putting you through now."
  # Cold handoff, said to a caller who demanded a person, just before the call is sent through.
  handoff_now: Transferring you to a person now.
  lead_stored: Someone from our team will call you {when} to tell you more.
  # The callback time as said: a time we named, or the window the caller asked for. A caller who
  # says "after 5" hears a time inside that window, so they know when to expect it (eval round 3):
  # callbacks.after_lead_minutes past the start.
  callback_by: by {time}
  callback_after: around {time}
  callback_before: before {time}
  callback_between: between {start} and {end}
  callback_asap: as soon as they can
  callback_at: around {time}
  callback_outside_hours: >-
    Our team makes calls between {opens} and {closes}, so the closest I can do is {nearest}. Would
    that work?
  # {address} is street, unit, city and ZIP; {phone} is read in groups. Naming it a home is how
  # every booking confirms the caller is residential.
  # One sentence with no lead-in, said once (eval round 3).
  # Shorthand, street and unit and the number (Jackson: "just shorthand like 'the 199 e 4th street
  # and unit 2'"), ending "That's all correct, right?" (Retell call call_9826ff9f0dfa8bc835a3601368b).
  read_back: So that's {address}, and {phone}. That's all correct, right?
  # The number the call came from, said instead of its digits in the read-back.
  read_back_calling_from: the number you're calling from, ending in {last_four}
  # A later read-back on the same call names the number by its last four digits (Jackson: "one full
  # readback, but then if there's ever other readbacks necessary, it just says and the phone number
  # ending in 4024").
  read_back_number_ending: the number ending in {last_four}
  # The spec's line: the details are passed on (record_lead keeps them for the office).
  commercial: >-
    Thanks for thinking of us. Unfortunately, we only service homes, but I'll pass your details to
    our team.
  # A caller who offers a card (DECISIONS.md 080): said word for word by the voice layer. The
  # office follows up from the flag the server stores. Signed off by Jackson (coauthoring safety r1).
  card_stop: >-
    For your security, please don't read a card number over the phone. Our office will send you a
    secure payment link, or call you to take the payment.
  # A caller who disputes a charge. {when} is the office callback time, such as "by 10:30 AM".
  # Signed off by Jackson (coauthoring safety r1).
  billing_callback: >-
    I'm sorry about that. Billing goes through our office, so I've asked them to look into the
    charge, and someone from the office will call you {when}.
  # Added to a booking's sentence when who can approve isn't settled. {when} is "by 9 PM".
  approval_callback: >-
    Before the technician heads out, someone from our team will call you {when} to confirm who can
    approve the work.
  # The same, when calling hours leave no time before the window: the job is held for a person.
  approval_callback_late: >-
    Someone from our team will call you {when} to confirm who can approve the work, and the
    technician won't start until that's settled.
  # Work the company doesn't do (services.not_offered). {what} is "plumbing"; {suggest} is "a
  # plumber".
  not_offered: >-
    Unfortunately we don't do {what}, so {suggest} would be the right call for that.
  out_of_area: >-
    Unfortunately that's outside the area we cover, so we're not able to send someone. A local heating
    company should be able to help.
  # The address lookup (tools.find_address and the ZIP check). {street} is "248 Duffield Street",
  # {where} the neighborhood or borough, {found} and {said} ZIPs written out digit by digit.
  zip_mismatch: >-
    I have {street} in {where} as {found}, not {said}. Which one is right?
  address_which: Is that the one in {places}?
  address_not_found: I'm not finding that street. Could you spell the street name for me?
  address_ask_zip: What's the ZIP code there?
  # The lookup missed twice and no borough was said: asked once, so the visit can be booked.
  address_ask_borough: And which borough is that in?
  # The city's records don't have the address: booked as the caller gave it, confirmed by the office.
  address_unverified: >-
    I can't find that one in the city's records, so I'll book it as you gave it, and our office will
    confirm the address before the technician heads out.
  # A building with more than one home in it, read back with no unit (MapPLUTO's unit count).
  address_ask_unit: And what's the apartment or unit number there?
  # Asked before a number goes on the do-not-call list (Jackson's number went on it from "don't call
  # me then" said in passing).
  # A visit booked from this number that the field service system can't find.
  visit_missing: >-
    I can't pull up that visit in our system right now, so I've asked the team to look into it and
    get back to you.
  do_not_call_confirm: Just to confirm, you'd like us to stop calling this number?
  do_not_call: Understood, we won't call you.
  do_not_call_undone: No problem, we'll call you again when we need to.
  do_not_call_with_callback: Understood, we won't call you. Give us a call any time you need us.
  repeated_drops: >-
    Looks like we keep getting cut off, the signal might be spotty. Want me to have someone call you
    back in a few minutes instead?
  limit: I've already got that taken care of on this call, so let me have someone from the team follow up.
  slot_taken: That window just filled up.
  # A caller on file booking an address that isn't theirs on file (eval round 2, seed 5). Asked as
  # one plain yes or no (Retell call call_1840576e622e3d729b760085142: the either/or confused a
  # caller); a no puts the address on its own account, with the caller as a contact.
  account_choice: Should I put this under your account?
  account_name: Whose name should the account for that address be under?
  # An open visit at the address whose arrival window has ended (tools._passed_visit). {day} is
  # "today", "yesterday" or a weekday; {between} is "8 and 12".
  visit_passed: >-
    I see a visit there that was due {day} between {between}, and it's still open on our end. Did
    the technician make it out?
  # A number that matched more than one account, when the address doesn't say which (issue #128).
  account_which: I see more than one account on this number. Whose name should the visit go under?
  # The read-back when the number reaches someone else ("call my daughter at ..."). {who} is how
  # the caller named them.
  read_back_for: So that's {address}, and the number to reach {who} is {phone}. That's all correct, right?
  # Before a change from a number that isn't on the account (issue #128). {thing} is "visit" or
  # "account". The caller says the details; the agent never reads them out.
  identity_check: >-
    Of course. And just to confirm you're the person for the {thing}, could you tell me your name
    and the address?
  identity_check_name_only: >-
    Of course. And just to confirm you're the person for the {thing}, what name is it under?
  identity_check_address_only: >-
    Of course. And just to confirm you're the person for the {thing}, could you tell me the address?
  # A mover whose name check failed asks to book at the new address (issue #149).
  move_unverified: >-
    I can't add a new address to the account from this number, so I can't book the visit there
    yet. Someone from our office can call the number we have on file to update it and book the
    visit. Would that help?
  # A time the caller named that no visit window holds ("at 8 PM"); the nearest window follows.
  arrival_outside_hours: Our visits run from {hours}.
  # Right after the read-back, for a caller with no account who hasn't said a name.
  booking_name: Thanks. And what name should I put the visit under?
  identity_check_address: Thanks. And what's the address?
  identity_check_name: Thanks. And what's the name on the {thing}?
  identity_check_again: >-
    I didn't quite catch that. Could you tell me your name and the address for the {thing}?
  identity_mismatch: >-
    Unfortunately I'm not able to make that change from this number. I can have someone from our
    office call the number we have on file for it. Would that help?
  flag_stored_on_file: I've let our team know, and someone will call the number we have on file {when}.
  # A caller who moved (tools.record_move). {street} is the new street and unit.
  move_which: Which address did you move from?
  move_done: Thanks for letting us know. I've updated your address to {street}.
  move_visit_moved: Your upcoming visit is now set for the new address, same day and time.
  move_visit_moved_when: Your visit {when} is now set for the new address, same time.
  move_out_of_area: >-
    Thanks for letting us know. Unfortunately the new address is outside the area we cover, so we
    won't be able to come out there, and I've made a note on your account.
  move_visit_cancelled: >-
    I've also cancelled the visit you had at the old address, so nobody heads there.
  move_visit_person: >-
    A technician is already on the way to the old address, so someone from our office will call
    you to sort that out.
  # The heads-up call to the number on file after a change from another number (app/heads_up.py),
  # said once, also as the voicemail. {change} is what happened; {phone} is our number, read out.
  heads_up: >-
    This is Summit Air. {change} by a caller from another number. If that wasn't you, please call
    us back at {phone}.
  moved_from_address: Our records show you've moved from that address. Where should the technician go?
  location_superseded: >-
    That visit is still set for your old address, so let me have someone from our office sort it
    out with you.
  # Added to the booking sentence for a return visit soon after a job at the same address.
  return_visit_review: >-
    Since we were just out there, a manager will look over this visit, including whether it's
    covered, before the technician arrives.
  # {length} is the usual window length, such as "30 minutes".
  arrival_no_fit: >-
    Our arrival windows are {length}, and the technician can come any time in the window, so I
    can't promise an exact time.
  # Said once when the server marks a call Urgent (spec S-21a). Below Urgent, no priority is named.
  urgent_priority: I've marked this call top priority, so you get our soonest opening.
  # Said once when the caller's own facts raised the priority below Urgent (Jackson: "it makes them
  # feel heard").
  raised_priority: Thanks for telling me. I've moved you up so you'll get one of our earlier openings.
  # A raised priority that leaves the offered window where it was (Jackson's wording).
  priority_same_offer: Thanks for telling me. I've moved you up, and this is still our soonest opening. Does that still work?
  anything_else_first: Is there anything else I can help with?
  # Ends a booking sentence instead of after_confirmation when the caller named another unit that
  # has no booking yet (DECISIONS.md 085). {unit} is "5C".
  next_unit: Now let's set up apartment {unit}.
  # Ends a booking, reschedule or cancel sentence, which the voice layer speaks with no model step.
  after_confirmation: Anything else?
  # Added to an urgent booking with no window today; the server has flagged a person to move it up.
  seek_earlier_note: I've also asked our team to look for an earlier opening.
  # The first line of a call the system places (journey 12). {day} is "today", "tomorrow" or a
  # weekday; {window} is spoken, such as "2 to 4".
  earlier_slot_offer: >-
    Hi, this is Summit Air calling about your appointment. We've had an opening {day} at {window},
    would you like it?
  # A callback opens by asking for the person who asked for it, so a yes confirms who answered
  # (docs/decisions/49-callback-opening-name.md). Without one known name, the plain line.
  callback_opening: Hi, this is Summit Air calling back for {first_name}. Is that you?
  callback_opening_unknown: Hi, this is Summit Air calling you back, like we said we would.

# What the voice worker says on its own, without the model (voice/livekit). {first_name} is the
# matched customer's first name; {phone} is our number, on outbound calls.
voice:
  # Summit Air never ends a sentence, so the voice doesn't lift on it (Jackson, call
  # call_7727509d3289c4434b27efdad5b).
  greeting_known: Hi {first_name}, thanks so much for calling Summit Air today! I'm Brooke, the virtual assistant. How can I help?
  greeting_unknown: Hi there, thanks so much for calling Summit Air today! I'm Brooke, the virtual assistant. How can I help?
  # Two-party consent (the owner's Settings page, app/owner_settings.py): said just before the
  # greeting, and by the worker when a caller objects and the recording stops. Off by default:
  # New York needs only one party's consent to record.
  recording_notice: This call may be recorded.
  recording_stopped: Okay, I've turned the recording off.
  # No "we got cut off" greeting on a call that follows a dropped one: in a demo the same number
  # calls several times (Jackson, call call_7255ab47e30637f207e49f5bdeb).
  # Dead air (DECISIONS.md 081, voice.dead_air in config/models.yaml for the timings): the check-in
  # said every couple of minutes of silence, and the goodbye before the agent hangs up, in Jackson's
  # words.
  still_here: Take your time, I'm still here.
  stepped_away: >-
    It sounds like you've stepped away, so I'm going to hang up for now. Once you're ready, feel free
    to call this number back, and we can pick up where we left off.
  # Said when the model ends the call without a goodbye of its own (knowledge/sign-off.md). Generic
  # and kind, the same on any day (eval round 3).
  goodbye: Thanks for calling Summit Air. Have a great rest of your day.
  # Said by the worker when the tool server can't be reached, then the call ends.
  server_down: >-
    Sorry, our system is having trouble right now. Please call us back in a few minutes, and if you
    smell gas, hang up and call 9-1-1 from outside.
  # A voicemail left while every line was busy gets a callback within this. ASSUMED.
  voicemail_callback_minutes: 60
  # Played by Twilio when the voice worker is down (scripts/phone/fallback.py), then a voicemail.
  fallback: >-
    Thanks for calling Summit Air. If you smell gas, hang up and call 9-1-1 from outside. We can't take
    your call right now. Please leave your name, number and what's going on after the tone, and we'll
    call you back.
  outbound_voicemail: >-
    Hi, this is Summit Air calling about your appointment. Please give us a call back at {phone}.
  # Said at the end of a reply that calls a look-up when the caller would otherwise hear only "Got
  # it." before the wait (issue #149), in turn, never the same one twice in a row.
  holding:
    - Just give me one second.
    - Let me pull that up.
    - One moment.
  # Pre-recorded, so they need no voice stream (docs/scaling.md). Regenerate the clips after a change:
  # uv run python -m voice.livekit.clips. Each bridge clip must stay under 1.6 seconds (voice/livekit/bridge.py).
  clips:
    bridge_one_sec: Okay, just give me one second.
    bridge_pull_up: Sure, let me pull that up.
    bridge_moment: Alright, one moment.
    at_capacity: >-
      Thanks for calling Summit Air. If you smell gas, hang up and call 9-1-1 from outside. All our
      lines are busy right now. Please leave your name, number and what's going on after the tone,
      and we'll call you back.

# Job types booked without the repair intake (since, tried, who's home, approver): a quote for a new
# system, where nothing broke and nobody approves (Jackson, call_2fb4e053ba8b76b57c348845990).
intake:
  skip_for: [estimate]

# The open question before booking (prompts/spine.md): a gate code or buzzer, and pets only when
# true. Jackson, call_2fb4e053ba8b76b57c348845990: "drop pets".
visit_questions:
  pets: false

# Documents in knowledge/ that only lookup_hvac_info reads (app/hvac_info.py): kept out of the prompt,
# and searched when the caller asks how equipment works, what a sound means, or about maintenance.
# The source is Jackson's Retell knowledge base (retell/summit-air-jackson/kb-source on
# joco/retell-agent). It holds no repair steps or prices.
lookup_knowledge: [hvac-basics]

# Owner edits (app/rules.py). A wording line whose default says this must keep it, so an owner can't
# reword away the line that tells callers they're talking to an AI.
owner_rules:
  disclosure: [virtual assistant]
