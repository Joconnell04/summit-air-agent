# Everything specific to Summit Air lives here and in seed.py. The mock's code reads this file
# and works for any trade. Values marked ASSUMED are guesses until Summit Air confirms them.

tenant_id: 1000

company:
  name: Summit Air
  timezone: America/New_York
  state: NY
  country: USA
  # Main line and the domain used for generated technician email addresses. ASSUMED; the
  # 555-01xx numbers and .example are reserved for fiction.
  phone: "(718) 555-0100"
  email_domain: summit-air.example
  # Customer types the company does not book. Each key maps to the message the agent says (not
  # ServiceTitan: its API takes any customer type). These customers can still be stored and can
  # leave a lead.
  rejected_customer_types:
    Commercial: This company only books residential customers. Record a commercial lead instead.
  # ASSUMED hours, seven days since live call 1 (Jackson: "Saturday and Sunday should also be
  # available", DECISIONS.md 095). Arrival windows below stay inside them. The seeded world staffs
  # weekends lightly (tenants/summit-air/seed.py); the live demo staffs them through
  # scripts/open_live_schedule.py.
  hours:
    mon: ["08:00", "20:00"]
    tue: ["08:00", "20:00"]
    wed: ["08:00", "20:00"]
    thu: ["08:00", "20:00"]
    fri: ["08:00", "20:00"]
    sat: ["08:00", "20:00"]
    sun: ["08:00", "20:00"]

# Fees are null because Summit Air's real fees are unknown. The agent never states a fee
# unless one is configured here.
fees:
  diagnostic: null
  after_hours: null

# Mock credentials for the OAuth client-credentials flow. Not real secrets. user_id is the
# ServiceTitan user the integration acts as; it shows as createdById on notes it adds.
auth:
  client_id: cid.summit-air-mock
  client_secret: cs.summit-air-mock
  app_key: ak1.summit-air-mock
  user_id: 9001

# The address lookup (app/geocode.py, on when GEOCODER=geosearch): NYC Planning's GeoSearch, built
# on the city's Property Address Directory, with the Census geocoder behind it. `boroughs` maps
# what a caller says to the directory's borough; `zip_boroughs` reads a Census answer's borough
# from its ZIP. Research: docs/explorations/015-address-lookup.md.
address_lookup:
  geosearch_url: https://geosearch.planninglabs.nyc/v2/search
  census_suffix: ", NY"
  boroughs:
    brooklyn: Brooklyn
    kings: Brooklyn
    queens: Queens
    staten island: Staten Island
    richmond: Staten Island
    manhattan: Manhattan
    bronx: Bronx
    the bronx: Bronx
  zip_boroughs: {"100": Manhattan, "101": Manhattan, "102": Manhattan, "103": Staten Island,
                 "104": Bronx, "112": Brooklyn, "110": Queens, "111": Queens, "113": Queens,
                 "114": Queens, "116": Queens}

