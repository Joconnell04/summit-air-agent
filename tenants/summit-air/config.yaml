  - {id: 12, name: Residential Install, active: true}

# duration is in seconds, as in ServiceTitan. code is ours (ASSUMED field).
job_types:
  - {id: 201, code: no_heat, name: No heat, duration: 7200, priority: Urgent, businessUnitIds: [11], skills: [heating], active: true}
  - {id: 202, code: no_cooling, name: No cooling, duration: 7200, priority: Urgent, businessUnitIds: [11], skills: [cooling], active: true}
  - {id: 203, code: tune_up, name: Maintenance tune-up, duration: 5400, priority: Normal, businessUnitIds: [11], skills: [maintenance], active: true}
  - {id: 204, code: safety_check, name: Safety check, duration: 5400, priority: High, businessUnitIds: [11], skills: [heating], active: true}
  - {id: 205, code: estimate, name: Replacement estimate, duration: 5400, priority: Normal, businessUnitIds: [12], skills: [], active: true}

arrival_windows:
  - {id: morning, start: "08:00", end: "12:00"}
  - {id: afternoon, start: "12:00", end: "16:00"}
  - {id: evening, start: "16:00", end: "20:00"}
  - {id: after_hours, start: "20:00", end: "08:00", ends_next_day: true, after_hours: true}

# Technicians kept free for urgent jobs, per arrival window. This is Summit Air's own rule, applied
# by the tool server when it offers times (app/capacity.py); ServiceTitan's capacity has no such
# hold and the mock does not apply it. After-hours windows (the on-call technician) are urgent-only
# the same way. Only the business units listed in business_unit_ids hold any. per_day is keyed by the same day names as company.hours; a day or
# window left out holds none.
urgent_hold:
  business_unit_ids: [11]
  per_day:
    mon: &weekday_hold {morning: 2, afternoon: 2, evening: 2}
    tue: *weekday_hold
    wed: *weekday_hold
    thu: *weekday_hold
    fri: *weekday_hold
    sat: {morning: 1, afternoon: 1, evening: 1}
    sun: {morning: 1, afternoon: 1, evening: 1}

# Call reasons, as ServiceTitan's jbce call-reasons list returns them. A lead carries one of the
# lead reasons (isLead) as its callReasonId; the agent's lead kinds map onto these in agent.yaml.
call_reasons:
  - {id: 701, name: Replacement, isLead: true, active: true}
  - {id: 702, name: Install, isLead: true, active: true}
  - {id: 703, name: Estimate, isLead: true, active: true}
  - {id: 704, name: Commercial, isLead: true, active: true}
  - {id: 705, name: Other, isLead: true, active: true}
  - {id: 706, name: Work we don't do, isLead: true, active: true}
  - {id: 710, name: No heat, isLead: false, active: true}
  - {id: 711, name: No cooling, isLead: false, active: true}
  - {id: 712, name: Tune-up, isLead: false, active: true}
  - {id: 713, name: Quote for new system, isLead: true, active: true}
  - {id: 714, name: Question about my visit, isLead: false, active: true}
  - {id: 715, name: Billing question, isLead: false, active: true}

# Tag types, as ServiceTitan's settings tag-types list returns them. The three callback tags are how
# an outbound callback is dispositioned: a person at the office applies one in ServiceTitan the way
# they would mark any call, and the tool server applies one to the callbacks it places itself
# (docs/decisions/26-callback-done.md). agent.yaml names which tag means what.
tag_types:
  - {id: 801, name: Callback resolved, code: CB-RES, color: "#2e7d32", active: true}
  - {id: 802, name: Callback open, code: CB-OPEN, color: "#ef6c00", active: true}
  - {id: 803, name: No contact, code: CB-NONE, color: "#757575", active: true}

# Names for the system_type values on installed equipment. A type left out is shown as its id with
# underscores replaced by spaces.
equipment_labels:
  central_ac: central AC
  ductless_mini_split: ductless mini split
  heat_pump: heat pump

campaigns:
  - {id: 301, name: AI phone agent, active: true}
  - {id: 302, name: Phone, active: true}

cancel_reasons:
  - {id: 401, name: Customer cancelled, active: true}
  - {id: 402, name: Rescheduled elsewhere, active: true}
  - {id: 403, name: Duplicate booking, active: true}

booking_providers:
  - {id: 501, name: Summit Air phone agent, active: true}

# ASSUMED perks, from docs/explorations/001-hvac-shop-operations.md. In real ServiceTitan these
# live in discounts and recurring service templates, not on the membership type.
# visits names the included service visits: a visit falling in one of the listed months (1 to 12)
# gets that name, so a plan with two visits a year gets one of each season.
membership_types:
# One plan: a caller is either a Summit member or not.
  - id: 601
    name: Summit Standard Membership
    active: true
    visits:
      - {name: Heating system tune-up, months: [8, 9, 10, 11, 12, 1, 2]}
      - {name: Cooling system tune-up, months: [3, 4, 5, 6, 7]}
    perks: {prioritySched: true, visitsPerYear: 2, repairDiscountPercent: 15, afterHoursFeeWaived: true}
