[project]
name = "summit-air-agent"
version = "0.1.0"
description = "Inbound phone agent for Summit Air, a residential HVAC company in NYC"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "anthropic>=2.4.0",
    "langsmith>=0.14.17",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = [".claude/worktrees"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".claude"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Form"]
