[project]
name = "summit-air-agent"
version = "0.1.0"
description = "Inbound phone agent for Summit Air, a residential HVAC company in NYC"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pyyaml>=6",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
