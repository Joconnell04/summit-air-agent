[project]
name = "summit-air-agent"
version = "0.1.0"
description = "Inbound phone agent for Summit Air, a residential HVAC company in NYC"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    # The tool server's technician summary (app/summary.py) and the eval harness.
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiortc>=1.15.0",
    "langsmith>=0.14.17",
    "pytest>=8",
    "ruff>=0.6",
    "websockets>=17.4",
]
livekit = [
    "livekit-agents~=1.8.10",
    "livekit-api>=1",
    "livekit-plugins-anthropic~=1.8.10",
    "livekit-plugins-cartesia~=1.8.10",
    "livekit-plugins-deepgram~=1.8.10",
    "livekit-plugins-google~=1.8.10",
    "livekit-plugins-openai~=1.8.10",
    "livekit-plugins-silero~=1.8.10",
    "livekit-plugins-turn-detector~=1.8.10",
]

[tool.uv]
# The LiveKit worker's packages are their own group, so deleting voice/livekit after the bake-off
# (docs/architecture.md) also drops them; they install by default so its tests run in make check.
default-groups = ["dev", "livekit"]
# livekit-plugins-anthropic 1.8 still declares anthropic<2, but the eval harness needs 2.x. The
# plugin runs on 2.4 (tests/voice/test_voice_llm.py streams a reply through it), so the pin is
# overridden here rather than holding the evals back.
override-dependencies = ["anthropic>=2.4.0"]

[tool.ruff]
line-length = 100
extend-exclude = [".claude/worktrees"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".claude"]
markers = ["links_calls: run as a tenant that links a caller's calls (DECISIONS.md 118)"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Form"]
