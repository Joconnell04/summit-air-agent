<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/owner/static/revin-mark.png">
<link rel="preload" href="/owner/static/fonts/PublicSans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/owner/static/tokens.css">
<link rel="stylesheet" href="/owner/static/components.css">
{% block head %}{% endblock %}
<title>{% block title %}{{ tenant }}{% endblock %}</title>
</head>
<body>
{% block header %}
{% from "_ui.html" import status_line, q with context %}
<header class="app-header">
  <div class="inner">
    <a class="brand" href="/owner{{ q(slug) }}"><img src="/owner/static/revin-logo.svg" alt="Revin" width="88" height="15"><span class="rule"></span><span class="company">{{ tenant }}</span></a>
    <nav class="tabs" aria-label="Pages">
      <a href="/owner{{ q(slug, day if day is defined and not is_today else none) }}"{% if tab == "today" %} aria-current="page"{% endif %}>Today</a>
      <a href="/owner/calls{{ q(slug, day if day is defined and not is_today else none) }}"{% if tab == "calls" %} aria-current="page"{% endif %}>Calls</a>
      <a href="/owner/results{{ q(slug, day if day is defined and not is_today else none) }}"{% if tab == "results" %} aria-current="page"{% endif %}>Results</a>
    </nav>
    <div class="end">{{ status_line(status) }}</div>
  </div>
</header>
{% endblock %}
{% block body %}{% endblock %}
<script src="/owner/static/owner.js" defer></script>
</body>
</html>
