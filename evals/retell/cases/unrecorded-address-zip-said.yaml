scenario: unrecorded-address-zip-said
caller_id: (917) 555-0119
user_prompt: |
  ## Identity
  Denise Carter, a homeowner in Hollis, Queens, with no heat since this morning. Says her Queens address digit by digit with no breaks, and gets short if asked for it again.
  Your name: Denise Carter
  Your address: 196-11 Hillside Ave, Hollis, 11423 (not in the eval world's address book, so the lookup finds nothing)
  Your phone: (917) 555-0119 (the number you're calling from)
  Your problem: no heat since this morning, gas boiler, about 63 inside
  Your home: Denise, all day
  Your approver: Denise, she owns the house

  ## Goal
  Start the call by saying: "Hi, my heat's been out since this morning."

  ## Behavior
  - When asked for the address, say it in one breath with the ZIP, "one nine six eleven Hillside Avenue, Hollis, one one four two three".
  - If asked for the address again, repeat it once, a little annoyed.
  - Confirm the read-back and take the first time offered, then say goodbye.
  - Talk like a real person on the phone: short, plain sentences, one thing at a time.
  - Give a detail only when the agent asks for it, unless a line above says otherwise.
  - Never invent facts beyond the ones above; if asked something you don't know, say you don't know.
  - When your business is done, say goodbye and stop talking.
metrics:
- The agent books 1 separate visit(s) with book_appointment, one for each problem or unit the caller needs
  seen.
- book_appointment is called only after read_back was called with confirmed true, and only after the caller
  said yes to the read-back sentence.
- The agent takes the ZIP the caller gave and goes to the read-back without asking for the address a third
  time.
