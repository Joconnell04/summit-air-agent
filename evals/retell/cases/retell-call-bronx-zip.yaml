scenario: retell-call-bronx-zip
caller_id: (678) 555-0131
user_prompt: |
  ## Identity
  A Bronx homeowner booking a no-heat visit.
  Your address: 2500 Grand Concourse, Bronx, 10458
  Your phone: (678) 555-0131 (the number you're calling from)
  Your inside temp: 62 degrees
  Your wants: someone today or tomorrow

  ## Goal
  Start the call by saying: "Hi, my heat stopped working this morning. I'm in the Bronx, ZIP one zero four five eight."

  ## Behavior
  - Give the street address when asked and confirm a correct read-back.
  - Say goodbye once booked.
  - Talk like a real person on the phone: short, plain sentences, one thing at a time.
  - Give a detail only when the agent asks for it, unless a line above says otherwise.
  - Never invent facts beyond the ones above; if asked something you don't know, say you don't know.
  - When your business is done, say goodbye and stop talking.
metrics:
- The agent books exactly one visit with book_appointment at ZIP 10458.
- The agent treats the Bronx as in the area.
