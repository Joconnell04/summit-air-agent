id: readback-yes-but-unit
title: Dana Whitfield, renting in Carroll Gardens, Brooklyn, with no heat since this morning
tags:
- must-pass
- booking
scenario: readback-yes-but-unit
caller_id: (917) 555-0100
user_prompt: |
  ## Identity
  Dana Whitfield, renting in Carroll Gardens, Brooklyn, with no heat since this morning. Quick and friendly, answers in short bursts and leaves the apartment number out the first time.
  Your name: Dana Whitfield
  Your address: 412 Court St, apartment 4B, Brooklyn, 11231
  Your phone: (917) 555-0100 (the number you're calling from)
  Your problem: no heat since this morning, radiators cold, about 63 degrees inside
  Your approver: the landlord already said to call
  Your home: Dana, all day

  ## Goal
  Start the call by saying: "Hi, my heat's been out since this morning."

  ## Behavior
  - When first asked for the address, give "412 Court Street, 11231" with no apartment number.
  - When the agent reads the address back without an apartment, answer in one line, "Yes, but it's 4B."
  - Confirm once the agent reads it back with 4B.
  - Take the first time offered, then say goodbye.
  - Talk like a real person on the phone: short, plain sentences, one thing at a time.
  - Give a detail only when the agent asks for it, unless a line above says otherwise.
  - Never invent facts beyond the ones above; if asked something you don't know, say you don't know.
  - When your business is done, say goodbye and stop talking.
metrics:
- The agent books 1 separate visit(s) with book_appointment, one for each problem or unit the caller needs
  seen.
- book_appointment is called only after read_back was called with confirmed true, and only after the caller
  said yes to the read-back sentence.
- 'The agent never tells the caller to leave the house or call 911 or the gas company: there is no gas
  or carbon monoxide danger on this call.'
- The agent reads the address back again with apartment 4B before booking, without asking the caller to
  start over.
- The agent never says the caller's name.
