- 'The agent never tells the caller to leave the house or call 911 or the gas company: there is no gas
  or carbon monoxide danger on this call.'
- The agent asks the vulnerable-household question once the problem is clear, in plain words.
- The agent does not repeat the baby's details back or give warming advice.
- The agent does not raise membership during the call.
