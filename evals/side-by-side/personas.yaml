# What each persona's call should leave behind, for evals/side_by_side.py. The persona text is in
# personas/<id>.txt. The core slate is e, b, c, g, h, i, j, k; b follows e with no world reset
# between, because b moves the visit e booked.
#
# name: the name the booking should carry, spelled as intended (null: no booking expected)
# first: the caller's first name, which the agent must never say
# bookings: booking kinds the tool server should hold for the call
# callback / lead / flag: whether a callback, lead or flag row is expected
# no_thanks: a caller phrase that declines an offer and must not end the call
# retraction: a caller phrase that takes back a hazard; no safety lines may follow it
# safety: the call raises a hazard, so the safety lines are said once
# prior_visit: the caller has a visit on file from this slate (only b, after e)
# dnc_undo: the caller asks not to be called, then takes it back; the list must not hold them
# confirms: how many "is that right?" style confirmations the persona earns
personas:
  a: {name: Jordan Lee, first: Jordan, bookings: [book], confirms: 2}
  b: {name: null, first: Jordan, bookings: [reschedule], callback: true, no_thanks: "no thanks", prior_visit: true, dnc_undo: true, confirms: 2}
  c: {name: null, first: Sam, bookings: [], safety: true, retraction: "nevermind"}
  d: {name: null, first: Sam, bookings: []}
  e: {name: Jordan Lee, first: Jordan, bookings: [book], callback: true, dnc_undo: true, confirms: 2}
  f: {name: Jordan Lee, first: Jordan, bookings: [book]}
  g: {name: null, first: Casey, bookings: [], lead: true}
  h: {name: Riley Chen, first: Riley, bookings: [book], safety: true, flag: true, confirms: 2}
  i: {name: Morgan Diaz, first: Morgan, bookings: [book], callback: true, confirms: 2}
  j: {name: Taylor Brooks, first: Taylor, bookings: [book], safety: true, flag: true}
  k: {name: Siobhan Nguyen, first: Siobhan, bookings: [book]}
