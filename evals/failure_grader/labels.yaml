# Labeled calls for the failure grader (app/failure_grader.py, issue #178). Ids and labels only.
#
# Every call is a real Retell call. side-by-side: round 1 of the side-by-side eval
# (evals/rounds/side-by-side-01.md, branch joco/side-by-side-014a4c), whose tool-server rows were
# dumped right after each call; rows is that dump's path under evals/rounds/side-by-side-01-data.
# live: calls on the Summit Air numbers from Retell's recent list (POST /v3/list-calls). Their rows
# were read from the live tool server's database afterward and are kept outside the repo, since they
# hold callers' real numbers: set LIVE_ROWS_DIR to that folder (one <id>.json per call). Without it
# the grader is told the rows weren't kept and reads the transcript and its tool results.
#
# Each label is a person's reading of the transcript and rows against the five true failures in
# prompts/failure-grader.md, with the reason in one line. It is not the side-by-side checks: many
# calls those checks failed (a reworded line, an ended call, a booking the persona expected) are
# style, or are not a failure a caller or the owner would see.
# label: fail or ok. kind: the failure kind for a fail. borderline: a reasonable person could
# label it the other way; scored with and without. hard: the hard case it stands for.

