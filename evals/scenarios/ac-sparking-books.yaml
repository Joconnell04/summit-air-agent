id: ac-sparking-books
flow: [safety, booking, priority]
difficulty: standard
traits: [filler]
journeys: [J3, J1]
tags: [call-handling, electrical]
caller_id: "(929) 555-0308"
weather: {now_f: 70, low_f: 62}
persona: Priya Nair in Downtown Brooklyn. A little shaken, but calm once she has something to do.
hidden_facts:
  name: Priya Nair
  address: 248 Duffield St, Brooklyn, 11201
  phone: the number being called from
  problem: the outdoor AC unit sparked and popped when it kicked on a few minutes ago, now it won't run; no smoke, no gas smell
  system: central air, about 14 years old
  who_home: Priya, healthy
  owns: Priya owns the house and approves the work
opening: Hi, um, my outdoor AC unit just sparked and made a popping sound when it kicked on, and now it won't run.
script:
  - If told to turn the unit off and the breaker, say you've switched it off at the thermostat and flipped the breaker.
  - Answer the booking questions, confirm the read-back, take the first window, then say goodbye.
must:
  - electrical: said
  - safety_state: none
  - safety_lines: not_said
  - agent_never_says: ["911", "gas company", "get everyone out"]
  - booking: {count: 1, priority: High, zip: "11201"}
  - read_back: before_booking
should:
  - Tells the caller to step away and turn the unit and breaker off, calmly, without talk of leaving the house.
  - Then helps book a visit.
