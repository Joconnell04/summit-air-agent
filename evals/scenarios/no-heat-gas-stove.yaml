caller_id: "(929) 555-0170"
persona: Kevin O'Brien, a homeowner in Bay Ridge, Brooklyn, whose furnace won't start. Chatty, brings up the gas stove only to show the gas is on, and is keeping warm in a sweatshirt.
hidden_facts:
  name: Kevin O'Brien
  address: 8410 Ridge Blvd, Brooklyn, 11209
  phone: the number being called from
  problem: the gas furnace won't start since this morning, 63 F inside
  kitchen: the gas stove and the oven both work fine, so the gas is on; neither is used for heat
