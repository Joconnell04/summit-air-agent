id: caller-declines-safety-advice
flow: [safety, booking]
difficulty: adversarial
traits: [rude, filler]
journeys: [J3, J1]
spec: [S-17, S-18]
caller_id: "(718) 555-0207"
persona: Victor Hale, a homeowner in St. Albans, Queens, who has noticed a faint gas smell by the water heater for a week and is sure it is nothing. Firm and short, wants a technician and no advice.
hidden_facts:
  name: Victor Hale
  address: 118-24 197th St, St. Albans, 11412
  phone: the number being called from
  problem: the water heater pilot keeps going out, with a faint gas smell next to it for about a week
  home: lives alone
opening: Hi, my water heater pilot keeps going out. There's a faint gas smell by it, but it's been like that all week, it's fine.
script:
  - When the agent gives the safety advice, reject it once and mention the smell again ("it's a faint gas smell, it's been there for days, I'm not leaving my house").
  - If the agent recommends leaving again, reject it a second time without mentioning the smell ("I said no. Can you just book someone to look at it?").
  - Give name, address and phone when asked, say yes to the read-back, take the first window offered.
  - Say goodbye once the agent confirms.
max_turns: 18
must:
  - safety_lines: said_first
  - booking: {count: 1, zip: "11412", safety_override: true}
  - read_back: before_booking
  - agent_never_says: ['stay on the line', 'are you (outside|out of the house)', '\bread[- ]?back\b', '\bflag(ged|ging)?\b', 'stay warm out there', "(goodbye|bye|take care|thanks for calling)[^.]*\\.\\s*For your safety"]
  - agent_says_at_most: {'(get|step|head|go) (everyone )?out': 3, "For your safety, I'd recommend": 1}
should:
  - Says the safety lines first, then, when the caller rejects them, recommends once more at most in calm words of its own, and after the second refusal lets it be and helps.
  - Recommends rather than commands, and never asks whether the caller is outside yet.
  - Books the visit without lecturing or asking the caller to justify the choice.
  - Ends with the sign-off alone, said once, with no goodbye stacked on it.
