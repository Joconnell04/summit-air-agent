id: two-family-owner-residential
flow: [commercial, booking]
difficulty: standard
traits: [filler, self-correction]
journeys: [J8, J4]
spec: [S-07]
caller_id: "(631) 555-0133"
persona: Hollis Grant, owner of a two-family house in Brooklyn who lives on the first floor and rents out the upstairs apartment. Friendly, says um, fixes one thing.
hidden_facts:
  name: Hollis Grant
  address: 3221 Avenue N, Brooklyn, 11234
  phone: the number being called from
  building: two-family house, owner lives on the first floor, one tenant upstairs
  wants: the yearly furnace tune-up, a weekday morning
opening: Hi, um, I own a two-family house and I'd like my furnace serviced before it gets colder.
script:
  - Say you live downstairs and rent the upstairs, as soon as it matters.
  - Offer Tuesday, then correct it to Wednesday morning.
  - Take the first Wednesday window offered, then say goodbye.
  - Mention the shared basement and ask for a heads-up before the technician comes.
must:
  - booking: {count: 1, job_type: tune_up, zip: "11234"}
  - read_back: before_booking
  - safety_lines: not_said
  - tool_not_called: record_lead
  - outcome: booked
  - agent_never_says: ['\bread[- ]?back\b', '\bflag(ged|ging)?\b', 'comfort advisor', 'stay warm out there', '\bdog\b', 'let me read']
  - agent_says_at_most: {'is that right': 3}
should:
  - Treats an owner-occupied two-family house as residential and does not decline.
  - Does not use commercial wording or ask about the tenant's account.
  - Confirms who approves the work and who will be home.
  - Reads the address and number back once, in one sentence with no lead-in; after a correction, says the corrected sentence once.
  - Says only what the tools returned about open times, and answers the caller's confusion about which mornings were open plainly.
  - Turns the heads-up request into an action ("I'll ask them to give you a call about 30 minutes before they arrive").
  - The confirmation names the day and the date; the goodbye is short and kind, never "stay warm out there".
