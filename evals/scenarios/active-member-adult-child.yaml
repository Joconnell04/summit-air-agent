id: active-member-adult-child
flow: [membership, booking]
difficulty: standard
traits: [filler, self-correction]
journeys: [J5, J4]
spec: [S-09, S-10]
caller_id: seed:activeMemberWithAdultChild.adultChildPhone
persona: David Park, an adult child calling from a cell phone to book the yearly furnace tune-up for a parent who is a Summit member. Efficient, says um, fixes the day once.
hidden_facts:
  name: David Park
  parent: Linda Park, the member and the homeowner, home on weekdays
  address: 689 Springfield Blvd, Queens, 11432
  phone: the number being called from is David's own cell, best number to reach David
  wants: the yearly heating tune-up, a weekday afternoon
opening: Hi, I'm calling for my parent, Linda Park, who's a member with you, to book the yearly furnace tune-up.
script:
  - Give the address when asked, since the number you are calling from is not on the account.
  - Offer Wednesday afternoon, then change it to Thursday afternoon.
  - Say your cell is the best number to use.
  - Take whichever Thursday window the agent offers, then say goodbye.
must:
  - booking: {count: 1, job_type: tune_up, zip: "11432"}
  - read_back: before_booking
  - safety_lines: not_said
  - agent_never_says: "free (repair|repairs|parts|labor)|no charge"
should:
  - Finds the membership by address and thanks the member briefly.
  - Names only perks the plan includes, such as priority scheduling or the included tune-up.
  - Confirms who will be home and that Linda approves the visit.
