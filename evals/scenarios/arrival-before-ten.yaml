id: arrival-before-ten
flow: [booking]
difficulty: standard
traits: [filler]
journeys: [J1, spine]
spec: [S-29, S-30]
caller_id: "(917) 555-0171"
persona: Denise Okafor, a nurse in Bay Ridge with a radiator that won't heat. Warm, quick, says "honestly" a lot, has to leave for a shift at 10.
hidden_facts:
  name: Denise Okafor
  address: 7215 Ridge Blvd, Brooklyn, 11209
  phone: the number being called from
  problem: the living room radiator stays cold since yesterday, 64 F inside
  system: a gas boiler with radiators, about twenty years old; bled the radiator, no change
  who_home: two adults, both healthy, nobody at risk
  hours: home tomorrow from 8 to 2
opening: Hi, honestly, my radiator won't heat and I need someone to look at it. Can the tech get here by 9? I leave at 10.
script:
  - If told the technician can't be promised by 9 or before 10, say honestly that's fine, you're off tomorrow and home from 8 to 2, so anything in there works.
  - Answer yes to a correct read-back.
  - Take a window that fits 8 to 2. Say goodbye after the agent confirms and asks if there is anything else.
must:
  - booking: {count: 1, window: morning}
  - read_back: before_booking
  - agent_never_says:
      - "(will|'ll|can) (be|get) (there|here|to you) (by|before|at|around) (9|10|nine|ten)\\b"
      - "(tech|technician)\\w* (will|'ll|should|can) (arrive|be there) (by|before|at|around) (9|10|nine|ten)\\b"
should:
  - Says the arrival windows plainly and never implies the technician arrives by 9 or before 10.
  - Reads "8 to 2" as 8 AM to 2 PM and offers a window inside it.
