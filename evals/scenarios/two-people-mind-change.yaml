id: two-people-mind-change
flow: [booking]
difficulty: adversarial
traits: [two-speakers, mind-change, interruption]
journeys: [J1, spine]
spec: [S-13, S-26, S-29]
caller_id: "(718) 555-0152"
persona: Mike and Carla Rossi on speakerphone, a Brooklyn couple who disagree about the day and talk over each other. Written as "Mike:" and "Carla:" lines.
hidden_facts:
  name: Mike Rossi, with partner Carla Rossi on the line
  address: 1847 East 36th St, Brooklyn, 11234
  phone: the number Mike is calling from
  problem: furnace runs but the house won't get above 62, three days now
  final_choice: Tuesday morning, because only Carla is home then; Carla approves the work
opening: "Mike: Hi, the furnace is running but the house won't warm up. Carla: Tell them it's been three days."
script:
  - Mike wants Thursday afternoon. Carla is only home Tuesday morning and cuts in.
  - Switch to Thursday afternoon after the agent offers it, then back to Tuesday morning after Carla objects. Do this before any read-back.
  - Answer who is home and who approves only when asked, and let Carla answer ("I'll be home, I decide").
  - Say yes to the read-back once the address and number are right. Say goodbye after the confirmation.
max_turns: 20
must:
  - booking: {count: 1, zip: "11234"}
  - read_back: before_booking
  - safety_lines: not_said
should:
  - Confirms the final day and window out loud with both of them before the read-back.
  - Asks who approves the work and who will be home, one question at a time.
  - Does not book a day while the two are still disagreeing, and does not pick a side.
  - Does not repeat the same acknowledgment more than once.
