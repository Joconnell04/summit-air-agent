id: landlord-in-disguise
flow: [commercial, booking]
difficulty: adversarial
traits: [vague]
journeys: [J8, J6]
spec: [S-06, S-07]
caller_id: "(347) 555-0166"
persona: Ray Costa, a landlord who lives in one unit of a six-unit apartment building and talks as if it is just their own home. Casual and a little evasive, and says "my place" until pressed. An apartment building is residential (eval round 2), so this is a booking.
hidden_facts:
  name: Ray Costa
  address: 412 Hancock St, Brooklyn, 11216
  phone: the number they are calling from
  problem: no heat since last night, the boiler is not firing
  building: six apartments, tenants in all six, three called this morning; Ray lives in unit 1
opening: Hi, my place has no heat since last night, the boiler won't kick on.
script:
  - Say "my place" and "my boiler" for the first few turns. Give the address when asked.
  - When asked who is at home, or whether you own or rent, say "I own it, it's a six-unit building, I've got tenants in all six."
  - If the agent hesitates over the building, ask "I live here too, it's one boiler, why does it matter?"
  - You approve the work. Confirm the read-back, take the earliest window offered, then say goodbye.
must:
  - booking: {count: 1, zip: "11216"}
  - read_back: before_booking
  - tool_not_called: record_lead
  - outcome: booked
  - safety_lines: not_said
  - agent_never_says: "not the right fit"
should:
  - Treats a six-unit apartment building as residential and books without hesitation once the building size comes out.
  - Does not ask whether the building is a business more than once, if at all.
  - Does not give legal advice about heat in the building.
