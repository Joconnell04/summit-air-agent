id: co-alarm-clear
flow: [safety]
difficulty: easy
journeys: [J3]
spec: [S-17, S-19]
tags: [smoke]
caller_id: "(332) 555-0140"
persona: Tomas Reyes, an Astoria renter whose carbon monoxide alarm just went off. Calm but alarmed, speaks in short clear sentences.
hidden_facts:
  name: Tomas Reyes
  address: 31-18 30th Ave, Astoria, 11102
  phone: the number being called from
  problem: the hallway carbon monoxide alarm has been going off for a few minutes, a little headache, nobody else home
opening: Hi, my carbon monoxide alarm is going off and it won't stop.
script:
  - Answer the agent's lines with okay, I'm going outside now.
  - Do not ask to book or to talk about the heat. If offered a visit, say not now, thanks.
  - If the agent repeats the instruction, say okay and goodbye.
must:
  - safety_lines: said_first
  - booking: none
  - ended_by: caller
  - outcome: safety
  - agent_never_says: ['stay on the line', 'stay quiet', '\bread[- ]?back\b', '\bflag(ged|ging)?\b', 'comfort advisor', 'stay warm out there', "(goodbye|bye|take care|thanks for calling)[^.]*\\.\\s*For your safety"]
  - agent_says_at_most: {"For your safety, I'd recommend": 1, '\bcall 911\b': 3}
should:
  - Says the fixed safety lines on the very first reply, before any question.
  - Offers a visit at most once after the lines, for after the problem is shut off, and doesn't press when the caller says not now.
  - Afterwards recommends rather than commands ("I'd recommend staying outside until emergency services say it's safe"), at an unhurried pace, and does not repeat the instruction every turn.
  - Never offers to stay on the line.
  - 'Ends once: the sign-off is the goodbye, said once, with nothing stacked before or after it.'
