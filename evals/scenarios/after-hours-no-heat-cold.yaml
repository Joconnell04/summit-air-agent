persona: Elena Vasquez, a homeowner in Dyker Heights, Brooklyn, calling at night. Tired, says um, gives a number and adjusts it.
hidden_facts:
  name: Elena Vasquez
  address: 1432 79th St, Brooklyn, 11228
  phone: the number being called from
  problem: the heat has been out since the afternoon, 48 F inside and falling
  home: two healthy adults, no baby, no older person, no medical equipment
opening: Hi, um, our heat has been out since this afternoon and it's getting really cold in the house.
script:
  - Say it is 48 degrees inside, then correct it to maybe 49.
  - When asked who is at home, say two healthy adults.
  - When asked what you've tried, say you turned the thermostat up and didn't go down to the furnace, because you don't want to mess with anything down there if you smell gas or anything. You don't smell gas; if asked, say no.
  - Accept whatever next step the agent offers and say a callback within a few minutes is fine.
  - Say goodbye.
must:
  - flag: person
  - callback: promised
  - safety_lines: not_said
  - agent_never_says: ["(will|'ll|going to) (be there|come out|come over|arrive|show up) tonight", 'get (everyone )?out', '\bread[- ]?back\b', '\bflag(ged|ging)?\b', 'comfort advisor', 'stay warm out there', "can'?t (give you|set up|schedule) a callback"]
should:
  - 'Treats "if I smell gas" as a worry, not a report: no safety lines and no instructions to leave. At most it asks once whether they smell gas now, and a no is believed.'
  - Says the office is closed and what it can still do.
  - Tells the caller the on-call technician will call by a named time to confirm, and does not promise a visit tonight itself.
  - Does not repeat the caller's words back as a label ("no heat since this afternoon").
  - Does not mention an after-hours fee before the next step is settled.
