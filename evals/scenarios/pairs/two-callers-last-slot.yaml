# Two callers during a cold snap both want the one window left. Only one can have it; the other is
# told plainly it just went and takes the next opening. Format: evals/scenarios/pairs/README.md.
id: two-callers-last-slot
flow: [booking]
difficulty: standard
journeys: [J1, spine]
spec: [S-27]
world:
  job_type: no_heat
  fill: ["2026-11-02", "2026-11-03"]
  keep_open:
    - {date: "2026-11-02", window: afternoon, technicians: 1}
callers:
  - caller_id: "(332) 555-0161"
    persona: Janelle Brooks, a homeowner in Bay Ridge, Brooklyn, calling during a cold snap. Polite, quick, wants someone today if at all possible.
    hidden_facts:
      name: Janelle Brooks
      address: 8410 Ridge Blvd, Brooklyn, 11209
      phone: the number they are calling from
      problem: the boiler stopped heating this morning, 63 F inside
      system: gas boiler, about ten years old
      tried: turned the thermostat up, nothing else
      home: Janelle and her partner, both healthy adults, home all day
      approver: Janelle
    opening: Hi, our heat stopped working this morning and the house is getting cold.
  - caller_id: "(332) 555-0162"
    persona: Omar Haddad, a homeowner in Kensington, Brooklyn, calling during the same cold snap. Friendly, a little rushed, wants the earliest visit going.
    hidden_facts:
      name: Omar Haddad
      address: 412 Avenue C, Brooklyn, 11218
      phone: the number they are calling from
      problem: the furnace blows cold air since early this morning, 63 F inside
      system: gas furnace, about fifteen years old
      tried: changed the thermostat batteries
      home: Omar and his wife, both healthy adults, home all day
      approver: Omar
    opening: Hey, my furnace is only blowing cold air since this morning, can someone come out?
script:
  - Answer each question once, in a full sentence.
  - You want the earliest visit there is. Take the first window the agent offers, today if there is one.
  - If the agent says that window just went, take the next opening it offers.
  - Say goodbye once the agent asks if there is anything else.
must:
  - booking: {count: 1, job_type: no_heat, priority: High}
  - read_back: before_booking
  - said_booked: only_after_booking
  - slot_taken: told_plainly
  - safety_lines: not_said
together:
  - booked_together: true
  - one_job_per_technician_window: true
  - window_jobs: {date: "2026-11-02", window: afternoon, count: 1}
  - taken_refusals: 1
should:
  - The caller who lost the window hears it plainly, once, without blame, and is offered the next opening right away.
  - Neither caller is told they are booked before they are.
