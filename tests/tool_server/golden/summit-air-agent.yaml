lines:
  account_choice: Should that address go on its own account, with you as a contact, or under your account?
  account_name: Whose name should the account for that address be under?
  anything_else_first: Is there anything else I can help with?
  arrival_no_fit: Our arrival windows are {windows}, and the technician can come any time in the window,
    so I can't promise an exact time.
  callback_after: after {time}
  callback_before: before {time}
  callback_between: between {start} and {end}
  callback_by: by {time}
  callback_opening: Hi, this is Summit Air calling back for {first_name}. Is that you?
  callback_opening_unknown: Hi, this is Summit Air calling you back, like we said we would.
  callback_outside_hours: Our team makes calls between {opens} and {closes}. What time in there works?
  commercial: Thanks for thinking of us. Unfortunately Summit Air only works on homes, so we're not the
    right fit for this one.
  do_not_call: Understood, we won't call you.
  do_not_call_with_callback: Understood, we won't call you. That means the callback is off, so give us
    a call any time you need us.
  earlier_slot_offer: Hi, this is Summit Air calling about your appointment. We've had an opening {day}
    at {window}, would you like it?
  flag_stored: I've let our team know, and someone will call you {when}.
  flag_stored_no_callback: I've let our team know.
  flag_stored_urgent: I've marked this as urgent and let our on-call team know, so someone's keeping an
    eye on it. Someone will call you {when}.
  fsm_unavailable: I can't book that right now, but I've written it all down and someone will call you
    by {time} to confirm.
  fsm_unavailable_no_callback: I can't get to that right now, but I've written it all down for the team.
  lead_stored: Someone from our team will call you {when} to tell you more.
  limit: I've already got that taken care of on this call, so let me have someone from the team follow
    up.
  out_of_area: I'm sorry, that's outside the area we cover, so we're not able to send someone. A local
    heating company should be able to help.
  read_back: 'Let me read that back: your home at {address}, and the best number is {phone}. Is that right?'
  repeated_drops: Looks like we keep getting cut off, the signal might be spotty. Want me to have someone
    call you back in a few minutes instead?
  slot_taken: That window just filled up.
  urgent_priority: I've marked this as one of our most urgent calls, so you get our soonest opening.
