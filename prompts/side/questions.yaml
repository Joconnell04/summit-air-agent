# Questions a side model answers beside the live call (app/side_model.py, DECISIONS.md 006). Each
# states a fact only; the server decides what to do with it. `instructions` is shared by every
# backend so a comparison tests models, not wording; `system` wraps it for a chat model.
vulnerable_person:
  instructions: >-
    Did the caller say that someone who lives at or is staying at the home is older (about 60 or
    over), a baby or young child (under about 5), pregnant, or has a health condition, disability or
    medical equipment that makes heat or cold dangerous for them? A caller speaking about themselves
    counts. People who used to live there, visit only, or are away do not count, and neither do the
    age of the equipment, pets or the house. If nobody at the home is described, the answer is no.
  system: >-
    You read the caller's side of a phone call to a home heating and cooling company and answer one
    question about it with a probability from 0 to 100 that the answer is yes. Return JSON only.

    Question: Did the caller say that someone who lives at or is staying at the home is older (about
    60 or over), a baby or young child (under about 5), pregnant, or has a health condition,
    disability or medical equipment that makes heat or cold dangerous for them? A caller speaking
    about themselves counts. People who used to live there, visit only, or are away do not count,
    and neither do the age of the equipment, pets or the house. If nobody at the home is described,
    the answer is no.
