# Named model profiles. The live "brain" is chosen by `default` or MODEL_PROFILE=<name> at runtime,
# so switching provider or model is a one-line change. Every profile runs the same eval suite.
# Live profiles keep thinking or reasoning at its lowest: it adds seconds before the first word.
# Which profiles win is decided in docs/decisions/05-pipeline-and-models.md (#5); until then the
# non-Anthropic ids are candidates to measure, not choices.
# price is USD per million input and output tokens, used by the eval harness to cost each run.
# SOURCE for Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (Oct 2026).
# OpenAI and Gemini prices are ASSUMED placeholders until a run uses those profiles.
default: fast

providers:
  anthropic: {key_env: ANTHROPIC_API_KEY}
  openai: {key_env: OPENAI_API_KEY}
  gemini: {key_env: GEMINI_API_KEY}
  typesafe: {key_env: JEV_API_KEY}

profiles:
  fast:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: false
    price: {input: 0.10, output: 0.50}
  fast-prev:
    # Control: the model the earlier practice agent measured at about 1.0 s to first audio.
    provider: anthropic
    model: claude-haiku-4-5-20251001
    thinking: false
    price: {input: 1.00, output: 5.00}
  quality:
    provider: anthropic
    model: claude-sonnet-5-5
    # Sonnet 5.5 refuses thinking "disabled"; "between_tools" is its off switch.
    thinking: false
    thinking_off: between_tools
    price: {input: 2.00, output: 10.00}
  openai-fast:
    provider: openai
    model: gpt-5.4-mini
    thinking: false
    price: {input: 0.25, output: 2.00}
  gemini-fast:
    provider: gemini
    model: gemini-3.8-flash
    thinking: false
    price: {input: 0.30, output: 2.50}

# The ears and the voice for live calls (voice/livekit). The turn-taking values are ASSUMED starting
# points from the earlier practice agent (from-other-projects/bobert/latency-notes.md) until
# measured on real phone audio (docs/latency.md).
voice:
  stt: {provider: deepgram, model: nova-3, endpointing_ms: 100}
  # Katie, the Cartesia plugin default. The pre-recorded clips (voice/livekit/clips.py) use the same voice.
  tts: {provider: cartesia, model: sonic-3, voice_id: f786b574-daa5-4673-aa0c-cbe3e8534c02}
  # The silence that ends the caller's speech. LiveKit's turn detector refuses less than 0.25 s;
  # 0.25 s measured no faster than 0.35 s on the audio rig (evals/rounds/bakeoff-audio-02.md).
  vad: {min_silence_s: 0.35, activation: 0.5}
  # How long to wait after the caller stops before answering, counted by LiveKit from the end of
  # speech, so a min_delay under the silence wait above has no effect. "digits" applies right after
  # the agent asks for a phone number or ZIP, because people pause between groups of digits (C-48).
  endpointing:
    normal: {min_delay: 0.3, max_delay: 1.5}
    digits: {min_delay: 0.9, max_delay: 3.0}
  # Background noise must not stop the agent (S-50): an interruption needs recognized words, and a
  # false one resumes the reply.
  interruption:
    mode: adaptive
    min_words: 2
    min_duration: 0.5
    resume_false_interruption: true
    false_interruption_timeout: 1.5
  # Bridge line (docs/latency.md): played only when a tool hasn't answered after this long, and at
  # most once every this many caller turns.
  bridge: {after_s: 0.7, min_turns_between: 3}

# Off the live path: nobody is waiting, so thinking is on where quality matters.
offline:
  caller:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: false
    price: {input: 0.10, output: 0.50}
  grader:
    provider: anthropic
    model: claude-opus-5-5
    thinking: true
    price: {input: 4.00, output: 20.00}

# Side models: one narrow question each, answered beside the live call (app/side_model.py,
# DECISIONS.md 006). SIDE_MODEL=<name> turns one on for the tool server; empty is off. Compared in
# evals/decision-models (make eval-decisions). Prices SOURCE: docs/decisions/05-pipeline-and-models.md;
# OpenAI Decisions output is free (from-other-projects/bobert/decision-model-eval.md); Jev's output
# price is ASSUMED equal to its input price.
side:
  haiku:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: false
    price: {input: 0.10, output: 0.50}
  openai-decisions:
    provider: openai
    model: gpt-6-luna
    thinking: false
    price: {input: 0.10, output: 0.00}
  jev:
    provider: typesafe
    model: jev-latest
    thinking: false
    price: {input: 0.042, output: 0.042}

# The owner view's check on a saved draft (app/guidance_check.py). The owner is waiting on the
# save, so a small fast model with thinking off, answering in JSON.
owner_edits:
  guidance_check:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: false
    price: {input: 0.10, output: 0.50}

# After the call ends: the technician's job summary.
post_call:
  summary:
    provider: anthropic
    model: claude-sonnet-5-5
    thinking: true
    price: {input: 2.00, output: 10.00}

# The simulated audio bake-off (evals/audio_rig, DECISIONS.md 026). The rig's own voice for the
# simulated caller and ears for the agent's replies, the voice-activity threshold that times the
# agent's first sound, and per-minute prices for the parts a platform doesn't report itself.
audio_rig:
  # SOURCE for both Deepgram prices: https://deepgram.com/pricing (via docs/explorations/013).
  caller_voice: {provider: deepgram, model: aura-2-thalia-en, price_per_1k_chars: 0.030}
  agent_ears: {provider: deepgram, model: nova-3, price_per_minute: 0.0077}
  # ASSUMED: speech sits well above -40 dBFS and codec noise well below it; 40 ms of it is a word.
  vad: {threshold_dbfs: -40, min_voiced_ms: 40}
  # Our LiveKit stack's speech parts, to cost a rig call: Deepgram streaming (SOURCE as above) and
  # Cartesia Sonic (ASSUMED from the Startup plan, docs/cost.md). Its Claude tokens are counted
  # from the call record.
  livekit: {stt_per_minute: 0.0077, tts_per_1k_chars: 0.031}

# Speech-to-speech and managed-voice entrants on the rig. Profile names are dotted
# ("realtime.openai") so a results file names them like any other profile.
realtime:
  openai:
    provider: openai
    model: gpt-realtime-2.1
    # The caller's words reach the tool server's turn check through this transcription model.
    transcribe_model: gpt-4o-mini-transcribe
    voice: marin
    # OpenAI's server-side turn detection; 500 ms of silence is its default (ASSUMED as default).
    silence_ms: 500
    # USD per million tokens. SOURCE: https://developers.openai.com/api/docs/models/gpt-realtime-2.1
    # (read 2026-11-03). Transcription ASSUMED at gpt-4o-mini-transcribe's audio input rate.
    price: {text_input: 4.00, audio_input: 32.00, cached_input: 0.40, text_output: 24.00,
            audio_output: 64.00, transcribe_per_minute: 0.003}
  gemini:
    provider: gemini
    model: gemini-3.8-live
    voice: Kore
    # USD per million tokens. SOURCE: https://ai.google.dev/gemini-api/docs/pricing (read
    # 2026-11-03), paid tier.
    price: {text_input: 0.75, audio_input: 3.00, text_output: 4.50, audio_output: 12.00}
  elevenlabs:
    provider: elevenlabs
    # The brain behind ElevenLabs' custom-LLM mode is our own live profile.
    brain: fast
    tts_model: eleven_flash_v2
    voice_id: cgSgspJ2msm6clMCkdW9
    # USD per minute for the platform. SOURCE: https://elevenlabs.io/pricing/api (via exploration
    # 013); Claude tokens for the brain are counted separately.
    price_per_minute: 0.08
