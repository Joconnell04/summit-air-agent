# Named model profiles. The live "brain" is chosen by `default` or MODEL_PROFILE=<name> at runtime,
# so switching provider or model is a one-line change. Every profile runs the same eval suite.
# Live profiles keep thinking or reasoning at its lowest: it adds seconds before the first word.
# Which profiles win is decided in docs/decisions/05-pipeline-and-models.md (#5); until then the
# non-Anthropic ids are candidates to measure, not choices.
# price is USD per million input and output tokens, used by the eval harness to cost each run.
# SOURCE for Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (Oct 2026).
# OpenAI and Gemini prices are ASSUMED placeholders until a run uses those profiles.
default: fast

providers:
  anthropic: {key_env: ANTHROPIC_API_KEY}
  openai: {key_env: OPENAI_API_KEY}
  gemini: {key_env: GEMINI_API_KEY}

profiles:
  fast:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: false
    price: {input: 0.10, output: 0.50}
  fast-prev:
    # Control: the model the earlier practice agent measured at about 1.0 s to first audio.
    provider: anthropic
    model: claude-haiku-4-5-20251001
    thinking: false
    price: {input: 1.00, output: 5.00}
  quality:
    provider: anthropic
    model: claude-sonnet-5-5
    # Sonnet 5.5 refuses thinking "disabled"; "between_tools" is its off switch.
    thinking: false
    thinking_off: between_tools
    price: {input: 2.00, output: 10.00}
  openai-fast:
    provider: openai
    model: gpt-5.4-mini
    thinking: false
    price: {input: 0.25, output: 2.00}
  gemini-fast:
    provider: gemini
    model: gemini-3.8-flash
    thinking: false
    price: {input: 0.30, output: 2.50}

# Off the live path: nobody is waiting, so thinking is on where quality matters.
offline:
  caller:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: false
    price: {input: 0.10, output: 0.50}
  grader:
    provider: anthropic
    model: claude-opus-5-5
    thinking: true
    price: {input: 4.00, output: 20.00}

# After the call ends: the technician's job summary.
post_call:
  summary:
    provider: anthropic
    model: claude-sonnet-5-5
    thinking: true
    price: {input: 2.00, output: 10.00}
